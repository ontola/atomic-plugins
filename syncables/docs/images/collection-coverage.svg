<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">A documented page can prove range coverage</title><desc id="desc">An exhaustive ascending unique-ID page after 9 returns 10, 12 and 15. Under that provider contract the selected view is covered on (9,15], despite numeric gaps. The scope includes query, authorization and time consistency. Opaque cursor metadata alone is insufficient.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#536b80"/></marker></defs>
<rect width="1200" height="690" rx="18" fill="#fafbf9"/>
<g font-family="system-ui, sans-serif" fill="#17324d">
<text x="40" y="53" font-size="29" font-weight="700">A documented page can prove range coverage</text>
<rect x="40" y="90" width="1120" height="115" rx="13" fill="#ece5fa" stroke="#91a2b1" stroke-width="1.5"/>
<text x="59" y="123" font-size="22" font-weight="650">Provider contract</text>
<text x="59" y="155" font-size="20" font-weight="400">After ID 9, return the first 3 matching items in ascending unique-ID order.</text>
<text x="59" y="184" font-size="20" font-weight="400">No matching items are omitted within the page’s consistency guarantee.</text>
<rect x="168" y="290" width="807" height="86" rx="12" fill="#d9f2e9"/>
<path d="M110 333 H1090" fill="none" stroke="#536b80" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="168" cy="333" r="11" fill="#fafbf9" stroke="#17324d" stroke-width="2"/>
<text x="156" y="414" font-size="22" font-weight="400">9</text>
<circle cx="303" cy="333" r="11" fill="#17324d" stroke="#17324d" stroke-width="2"/>
<text x="291" y="414" font-size="22" font-weight="400">10</text>
<circle cx="437" cy="333" r="11" fill="#fafbf9" stroke="#17324d" stroke-width="2"/>
<text x="425" y="414" font-size="22" font-weight="400">11</text>
<circle cx="572" cy="333" r="11" fill="#17324d" stroke="#17324d" stroke-width="2"/>
<text x="560" y="414" font-size="22" font-weight="400">12</text>
<circle cx="706" cy="333" r="11" fill="#fafbf9" stroke="#17324d" stroke-width="2"/>
<text x="694" y="414" font-size="22" font-weight="400">13</text>
<circle cx="841" cy="333" r="11" fill="#fafbf9" stroke="#17324d" stroke-width="2"/>
<text x="829" y="414" font-size="22" font-weight="400">14</text>
<circle cx="975" cy="333" r="11" fill="#17324d" stroke="#17324d" stroke-width="2"/>
<text x="963" y="414" font-size="22" font-weight="400">15</text>
<text x="177" y="270" font-size="24" font-weight="650">Covered for this query: (9, 15]</text>
<text x="282" y="365" font-size="17" font-weight="400">returned</text>
<text x="551" y="365" font-size="17" font-weight="400">returned</text>
<text x="954" y="365" font-size="17" font-weight="400">returned</text>
<rect x="40" y="460" width="530" height="130" rx="13" fill="#d9f2e9" stroke="#91a2b1" stroke-width="1.5"/>
<text x="59" y="493" font-size="22" font-weight="650">What the gaps mean</text>
<text x="59" y="525" font-size="20" font-weight="400">11, 13 and 14 need not exist or match.</text>
<text x="59" y="554" font-size="20" font-weight="400">Their absence does not break coverage.</text>
<text x="59" y="583" font-size="20" font-weight="400">Other queries or accounts remain separate.</text>
<rect x="610" y="460" width="550" height="130" rx="13" fill="#fff0d8" stroke="#91a2b1" stroke-width="1.5"/>
<text x="629" y="493" font-size="22" font-weight="650">Qualify the time claim</text>
<text x="629" y="525" font-size="20" font-weight="400">Receipt time is not a provider snapshot time.</text>
<text x="629" y="554" font-size="20" font-weight="400">Opaque cursors alone do not describe this range.</text>
<text x="629" y="583" font-size="20" font-weight="400">No per-page coverage index in the daemon yet.</text>
<text x="40" y="645" font-size="21" font-weight="400">Declared semantics justify the inference; observed ordering alone cannot prove exhaustiveness.</text>
</g></svg>