[package]
name = "syncables-atomic-peer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Protocol, signatures, permissions and persistent Loro state come from the
# same core as Atomic clients. Upgrade this pin only with compatibility tests.
atomic_lib = { git = "https://github.com/ontola/atomic-server", rev = "30994948b5adadd765ecfcdccdf0aad14ef5be1a", features = ["db-redb", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "time"] }
tokio-tungstenite = "0.29"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
