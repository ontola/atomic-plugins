name: Devonian CI

# devonian/ was migrated in from the standalone localthought/devonian repo
# (see .github/workflows/devonian-publish.yml for the other half of that
# migration). It is a self-contained TypeScript package with its own
# package.json/pnpm-lock.yaml and does not depend on an atomic-server
# checkout the way integrations/ does (see ci.yml), so this workflow never
# touches atomic-server and skips its work entirely when a change doesn't
# touch devonian/.

on:
  pull_request:
  # Required so the merge queue's temporary gh-readonly-queue/... commit gets
  # a CI run at all: GitHub gates required checks on the merge_group event,
  # not on the pull_request run from the PR head. See ci.yml, which has the
  # same fix.
  merge_group:
  workflow_dispatch:

concurrency:
  group: devonian-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect devonian changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      devonian: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.devonian }}
    steps:
      # dorny/paths-filter reads changed files from the pull_request API, which
      # doesn't exist for a merge_group or workflow_dispatch event, so this step
      # is skipped there and the output above is forced to 'true' instead: the
      # queue and a manual dispatch always run the suite rather than
      # misdetecting an empty diff and reporting a green run that tested nothing.
      - name: Path filters
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            devonian:
              - 'devonian/**'
              - '.github/workflows/devonian-ci.yml'

  build:
    name: Lint, test, build
    needs: changes
    if: needs.changes.outputs.devonian == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: devonian
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: devonian/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run prettier:check
      - run: pnpm test
      - run: pnpm build
      # Re-runs the browser tests against the compiled build/ that npm
      # consumers get (`pnpm test` above bundles src/); which files, is the
      # `test:browser-build` script in devonian/package.json.
      - run: pnpm run test:browser-build
      # The real-browser specs need the full Chromium (`channel: 'chromium'`):
      # the headless shell refuses Background Sync registration.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:real-browser
