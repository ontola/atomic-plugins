name: integration-proxy CI

on:
  push:
    branches: [main]
    paths:
      - "integration-proxy/**"
      # The default-catalog tests compose ../overlays/catalog/2026-10-02.json, which is
      # what DEFAULT_CATALOG_PATH serves from GitHub Pages once merged.
      - "overlays/**"
  pull_request:
    paths:
      - "integration-proxy/**"
      - "overlays/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration-proxy
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OAUTH_GITHUB_ISSUES_CLIENT_ID: fixture-client
      OAUTH_GITHUB_ISSUES_CLIENT_SECRET: fixture-secret
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/connect_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integration-proxy -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test -- --include-ignored
      # The published crate must build from only the files `include`d in
      # Cargo.toml (no test fixtures), and the Heroku wrapper template must
      # compile against the library's public API, so an API change that
      # would break localthought/integration-proxy fails here first.
      - name: Package (builds from the packaged sources only)
        run: cargo package --locked
      - name: Build the Heroku wrapper template against this crate
        working-directory: integration-proxy/examples/heroku-wrapper
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/integration-proxy/target
        run: cargo build --config 'patch.crates-io.atomic-integration-proxy.path="../.."'
