name: Overlays CI

# overlays/ was migrated in from the standalone localthought/overlays repo
# (its former identity-overlays.yml workflow). GitHub Pages publishes it,
# with the rest of this repository, from main at
# https://ontola.github.io/atomic-plugins/overlays/ — see overlays/README.md
# and overlays-published.yml, which checks that publication after merge.
# This workflow validates catalog.json's compositions before merge, reading
# every overlay the catalog serves from GitHub Pages from the checkout
# instead (tests/generate_identity_catalog_fixtures.py), so it never depends
# on what Pages currently serves.

on:
  pull_request:
  # Required so the merge queue's temporary gh-readonly-queue/... commit gets
  # a CI run at all: GitHub gates required checks on the merge_group event,
  # not on the pull_request run from the PR head. See ci.yml, which has the
  # same fix.
  merge_group:
  workflow_dispatch:

concurrency:
  group: overlays-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect overlays changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      overlays: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.overlays }}
    steps:
      # dorny/paths-filter reads changed files from the pull_request API, which
      # doesn't exist for a merge_group event, so this step is skipped there and
      # the output above is forced to 'true' instead: the queue always runs the
      # suite rather than misdetecting an empty diff.
      - name: Path filters
        id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            overlays:
              - 'overlays/**'
              - '.github/workflows/overlays-ci.yml'

  validate:
    name: Validate catalog compositions
    needs: changes
    if: needs.changes.outputs.overlays == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overlays
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements-identity-tests.txt
      - name: Every catalog overlay is published from overlays/
        run: |
          python - <<'PY'
          import json, pathlib
          base = "https://ontola.github.io/atomic-plugins/overlays/"
          errors = []
          for platform in json.loads(pathlib.Path("catalog.json").read_text())["platforms"]:
              sources = platform.get("overlays", [])
              if platform["openapi"].startswith(base):
                  sources = [platform["openapi"], *sources]
              for url in sources:
                  if not url.startswith(base):
                      errors.append(f"{platform['name']}: {url} is not under {base}")
                  elif not pathlib.Path(url[len(base):]).is_file():
                      errors.append(f"{platform['name']}: overlays/{url[len(base):]} does not exist")
          if errors:
              raise SystemExit("\n".join(errors))
          PY
      - run: python tests/generate_identity_catalog_fixtures.py --output /tmp/identity-catalog
      - run: python tests/test_identity_overlays.py
