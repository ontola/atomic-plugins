name: Overlays CI

# overlays/ was migrated in from the standalone localthought/overlays repo
# (its former identity-overlays.yml workflow). GitHub Pages publishes it,
# with the rest of this repository, from main at
# https://ontola.github.io/atomic-plugins/overlays/ — see overlays/README.md
# and overlays-published.yml, which checks that publication after merge.
# This workflow validates catalog.json's compositions before merge, reading
# every overlay the catalog serves from GitHub Pages from the checkout
# instead (tests/generate_identity_catalog_fixtures.py), so it never depends
# on what Pages currently serves.

on:
  pull_request:
  # After a merge too, so main itself is known green: a test that depends on
  # another overlay or on the OAD history can break without a PR touching it.
  push:
    branches: [main]
  # Required so the merge queue's temporary gh-readonly-queue/... commit gets
  # a CI run at all: GitHub gates required checks on the merge_group event,
  # not on the pull_request run from the PR head. See ci.yml, which has the
  # same fix.
  merge_group:
  workflow_dispatch:

# Every job reads the checkout only. The `changes` job widens this for itself
# with `pull-requests: read`, which dorny/paths-filter needs on a PR.
permissions:
  contents: read

concurrency:
  group: overlays-ci-${{ github.ref }}
  # A newer push to a PR supersedes the older run; runs on main each vouch for
  # their own merge commit, so they are not cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect overlays changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      overlays: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.overlays }}
      reads: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.reads }}
    steps:
      # dorny/paths-filter reads changed files from the pull_request API, which
      # doesn't exist for a merge_group or workflow_dispatch event, so this step
      # is skipped there and the output above is forced to 'true' instead: the
      # queue and a manual dispatch always run the suite rather than
      # misdetecting an empty diff and reporting a green run that tested nothing.
      - name: Path filters
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            overlays:
              - 'overlays/**'
              - 'openapi-extensions/spec/pagination-schemes/**'
              - 'openapi-extensions/spec/crud-causality/**'
              - '.github/workflows/overlays-ci.yml'
            reads:
              - 'overlays/**'
              - 'syncables/src/**'
              - 'syncables/package.json'
              - 'syncables/package-lock.json'
              - '.github/workflows/overlays-ci.yml'

  validate:
    name: Validate catalog compositions
    needs: changes
    if: needs.changes.outputs.overlays == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overlays
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements-identity-tests.txt
      - name: Fetch OAD history without checking out its documents
        run: git clone --filter=blob:none --no-checkout --single-branch https://github.com/ontola/openapi-directory.git /tmp/openapi-directory
      - name: Validate every overlay's OAD path and last-change pin
        run: python scripts/validate_oad_pins.py --directory /tmp/openapi-directory --published origin/main --fetch-missing
      - name: Every catalog overlay is published from overlays/
        run: |
          python - <<'PY'
          import json, pathlib
          base = "https://ontola.github.io/atomic-plugins/overlays/"
          errors = []
          for platform in json.loads(pathlib.Path("catalog/2026-10-02.json").read_text())["platforms"]:
              sources = platform.get("overlays", [])
              if platform["openapi"].startswith(base):
                  sources = [platform["openapi"], *sources]
              for url in sources:
                  if not url.startswith(base):
                      errors.append(f"{platform['name']}: {url} is not under {base}")
                  elif not pathlib.Path(url[len(base):]).is_file():
                      errors.append(f"{platform['name']}: overlays/{url[len(base):]} does not exist")
          if errors:
              raise SystemExit("\n".join(errors))
          PY
      - run: python tests/generate_identity_catalog_fixtures.py --output /tmp/identity-catalog
      # Every tests/test_*.py, discovered rather than listed, so a new overlay
      # test runs without a workflow change. A test whose source declares a
      # "--directory" option (argparse, as test_pagination_collection.py does)
      # gets the openapi-directory clone above; the others run bare. Each test
      # runs even after an earlier one fails, and the step fails if any did.
      - name: Run every overlay test
        run: |
          set -u
          status=0
          for test in tests/test_*.py; do
            args=()
            if grep -q -- '"--directory"' "$test"; then
              args=(--directory /tmp/openapi-directory)
            fi
            echo "::group::python $test ${args[*]}"
            if ! python "$test" "${args[@]}"; then
              echo "::error file=overlays/$test::$test failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

  # overlays/tests/*.test.ts read real catalogs, their pinned OADs and the
  # local overlay bytes through syncables' own source (vitest), with
  # synthetic responses: no provider is called. Each composes its platform
  # with tests/compose_gitlab_platform.py, which reads the pinned OAD from
  # OPENAPI_DIRECTORY_REPO (the same blob-less clone as above) rather than
  # from raw.githubusercontent.com. Every *.test.ts under overlays/tests/ is
  # discovered, so a new one runs without a workflow change. Runs when an
  # overlay or syncables' source changes, since either can break a read.
  reads:
    name: Overlay reads through syncables
    needs: changes
    if: needs.changes.outputs.reads == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: syncables
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r ../overlays/requirements-identity-tests.txt
      - name: Fetch OAD history without checking out its documents
        run: git clone --filter=blob:none --no-checkout --single-branch https://github.com/ontola/openapi-directory.git /tmp/openapi-directory
      # Matches syncables' package.json "engines" (>= 22.11 < 23).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: syncables/package-lock.json
      - run: npm ci --no-audit
      - name: Run every overlays/tests/*.test.ts
        env:
          OPENAPI_DIRECTORY_REPO: /tmp/openapi-directory
        run: npx vitest run --root .. overlays/tests/
