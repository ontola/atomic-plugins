name: Syncables CI

# syncables/ was migrated in from the standalone localthought/syncables repo
# (see .github/workflows/syncables-publish.yml for the other half of that
# migration). It is a self-contained TypeScript package with its own
# package.json/package-lock.json and does not depend on an atomic-server
# checkout the way integrations/ does (see ci.yml). Its optional native peer
# pins atomic_lib as a Cargo dependency and has a separate compatibility job.
# Skip this workflow's implementation checks when syncables/ is unchanged.
#
# Do not confuse this with integrations/localthought/syncables/, an
# unrelated vendored Rust port ("syncables-rs") of the same upstream
# project — see that directory's UPSTREAM.md. That one is covered (if at
# all) by ci.yml/certify.mjs, not this workflow.

on:
  pull_request:
  # Required so the merge queue's temporary gh-readonly-queue/... commit gets
  # a CI run at all: GitHub gates required checks on the merge_group event,
  # not on the pull_request run from the PR head. See ci.yml, which has the
  # same fix.
  merge_group:
  workflow_dispatch:

concurrency:
  group: syncables-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect syncables changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      syncables: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.syncables }}
    steps:
      # dorny/paths-filter reads changed files from the pull_request API, which
      # doesn't exist for a merge_group or workflow_dispatch event, so this step
      # is skipped there and the output above is forced to 'true' instead: the
      # queue and a manual dispatch always run the suite rather than
      # misdetecting an empty diff and reporting a green run that tested nothing.
      - name: Path filters
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            syncables:
              - 'syncables/**'
              - '.github/workflows/syncables-ci.yml'
              - 'integration-proxy/tests/fixtures/device-contract.json'

  build:
    name: Lint, test, build (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.syncables == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syncables_test
          POSTGRES_PASSWORD: syncables_test
          POSTGRES_DB: syncables_cache_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncables_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SYNCABLES_TEST_DATABASE_URL: postgresql://syncables_test:syncables_test@127.0.0.1:5432/syncables_cache_test
    defaults:
      run:
        working-directory: syncables
    steps:
      - uses: actions/checkout@v4

      # Cover the minimum supported major and newer even-numbered releases.
      # Volta's Node 22 pin is a development default, not a runtime upper bound.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: syncables/package-lock.json

      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run prettier:check
      - run: npm test
      - run: npm run build
      - name: Test the installed daemon executable with invented loopback data
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          node scripts/daemon-smoke.mjs "$RUNNER_TEMP"/syncables-*.tgz

  atomic-peer:
    name: Native Atomic peer compatibility
    needs: changes
    if: needs.changes.outputs.syncables == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syncables_test
          POSTGRES_PASSWORD: syncables_test
          POSTGRES_DB: syncables_cache_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncables_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SYNCABLES_TEST_DATABASE_URL: postgresql://syncables_test:syncables_test@127.0.0.1:5432/syncables_cache_test
    defaults:
      run:
        working-directory: syncables
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: syncables/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: syncables/native-atomic-peer
      - run: cargo fmt --manifest-path native-atomic-peer/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path native-atomic-peer/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path native-atomic-peer/Cargo.toml
      - run: cargo build --locked --manifest-path native-atomic-peer/Cargo.toml
      - run: npm ci --no-audit
      - name: PostgreSQL to native process acceptance
        run: |
          SYNCABLES_ATOMIC_PEER_BINARY="$PWD/native-atomic-peer/target/debug/syncables-atomic-peer" \
            npx vitest run __tests__/unit/daemon/atomic-peer.test.ts --config __tests__/vitest.config.ts
