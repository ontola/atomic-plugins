openapi: 3.0.3
info:
  title: Illustrative relative next links
  version: 1.0.0
  description: >
    Synthetic. Shaped like classic Twilio list responses: next_page_uri is an
    absolute-path reference, resolved against the server URL.
servers:
  - url: https://api.example.com
components:
  paginationSchemes:
    linkedCollections:
      type: nextLink
      autoDetect: false
      request:
        queryParameters:
          PageSize:
            role: pageSize
      response:
        bodyFields:
          next_page_uri:
            role: nextLink
            linkResolution:
              base: server
              description: An absolute-path reference such as /2010-04-01/Accounts/AC0/Calls.json?Page=1.
          previous_page_uri:
            role: previousLink
            linkResolution:
              base: server
paths:
  /2010-04-01/Accounts/{AccountSid}/Calls.json:
    get:
      parameters:
        - name: AccountSid
          in: path
          required: true
          schema: { type: string }
        - name: PageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      x-pagination:
        - scheme: linkedCollections
          overrides:
            response:
              envelope:
                itemsField: calls
      responses:
        '200':
          description: One page of calls.
          content:
            application/json:
              schema:
                type: object
                properties:
                  calls:
                    type: array
                    items:
                      type: object
                      properties:
                        sid: { type: string }
                  next_page_uri: { type: string, nullable: true }
                  previous_page_uri: { type: string, nullable: true }
                  page: { type: integer }
                  page_size: { type: integer }
