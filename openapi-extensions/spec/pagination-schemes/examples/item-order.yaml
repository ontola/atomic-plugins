openapi: 3.0.3
info:
  title: Illustrative newest-first list paged by the last item's id
  version: 1.0.0
  description: >-
    Synthetic, shaped like Discord's Get Channel Messages: messages come from
    newest to oldest, ids are numbers with a time prefix sent as strings, and
    before takes a message id. The cursor is the last (oldest) message's id,
    and the declared descending order of ids is checked by the client.
servers:
  - url: https://api.example.com
components:
  paginationSchemes:
    beforeLastMessage:
      type: pageToken
      autoDetect: false
      request:
        queryParameters:
          before:
            role: cursor
            fromLastItem: id
            order: descending
          limit:
            role: pageSize
paths:
  /channels/{channel_id}/messages:
    get:
      parameters:
        - { name: channel_id, in: path, required: true, schema: { type: string } }
        - { name: before, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      x-pagination:
        - scheme: beforeLastMessage
      responses:
        '200':
          description: Messages, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
