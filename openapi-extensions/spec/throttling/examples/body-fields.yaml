openapi: 3.0.3
info:
  title: Illustrative rate-limit backoff in the error body
  version: 1.0.0
  description: >-
    Synthetic, shaped like Todoist's API v1 errors: a 429 whose JSON body
    carries error_extra.retry_after in seconds, a field the API may also send
    on other errors.
servers:
  - url: https://api.example.com
x-throttling:
  bodyFields:
    error_extra.retry_after:
      role: retryAfter
      unit: deltaSeconds
  signals:
    - status: [429]
      meaning: throttled
paths:
  /tasks:
    get:
      responses:
        '200': { description: Tasks }
        '429':
          description: 'Too many requests; error_extra.retry_after says how long to wait.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  http_code: { type: integer }
                  error_extra:
                    type: object
                    properties:
                      retry_after: { type: integer }
