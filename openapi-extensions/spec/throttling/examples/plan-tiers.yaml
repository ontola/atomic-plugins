openapi: 3.0.3
info:
  title: Illustrative per-plan rate limit
  version: 1.0.0
  description: >-
    Synthetic, shaped like Clockify's documented API-key limits: counted per
    workspace, 30 requests per hour on the free plan and 20 or 50 per second
    on paid plans. A consumer without a configured plan paces at the free
    plan's rate.
servers:
  - url: https://api.example.com
x-throttling:
  limits:
    workspace:
      partitionBy: [account]
      description: Counted per workspace for requests with an API key.
      tiers:
        - name: FREE
          requests: 30
          window: { seconds: 3600, kind: unspecified }
        - name: BASIC STANDARD PRO
          requests: 20
          window: { seconds: 1, kind: unspecified }
        - name: ENTERPRISE
          requests: 50
          window: { seconds: 1, kind: unspecified }
  applies: [workspace]
  signals:
    - status: [429]
      bucket: workspace
      meaning: quotaExhausted
paths:
  /workspaces/{workspaceId}/projects:
    get:
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Projects }
        '429': { description: Too many requests }
