openapi: 3.0.3
info:
  title: Illustrative per-plan rate limit
  version: 1.0.0
  description: >-
    Synthetic, shaped like Clockify's documented workspace limits: 30 API
    requests per hour for a newly created Free workspace, 50 per second on
    any paid plan, and a third, invented tier to show three plans in one
    tier. A consumer without a configured plan keeps within every tier at
    once.
servers:
  - url: https://api.example.com
x-throttling:
  limits:
    workspace:
      partitionBy: [account]
      description: Counted per workspace for requests with an API key.
      tiers:
        - plans: [FREE]
          requests: 30
          window: { seconds: 3600, kind: unspecified }
        - plans: [TRIAL, BASIC, STANDARD, PRO]
          requests: 20
          window: { seconds: 1, kind: unspecified }
        - plans: [ENTERPRISE]
          requests: 50
          window: { seconds: 1, kind: unspecified }
  applies: [workspace]
  signals:
    - status: [429]
      bucket: workspace
      meaning: quotaExhausted
paths:
  /workspaces/{workspaceId}/projects:
    get:
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Projects }
        '429': { description: Too many requests }
