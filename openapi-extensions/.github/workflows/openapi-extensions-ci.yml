name: OpenAPI extensions CI

# openapi-extensions/ was migrated in from the standalone
# pondersource/openapi-extensions repo (#115). That repo's only workflow,
# authenticated-principal.yml, ran the Authenticated Principal schema tests
# and validated its example OpenAPI documents; it is translated here, scoped
# to openapi-extensions/ with working-directory and a path filter. The
# Throttling proposal's own unit tests (spec/throttling/test_validate.py),
# which the old repo never ran in CI, run here too. None of these specs has a
# build or a publish step: they are prose plus small Python validators.

on:
  pull_request:
  # Required so the merge queue's temporary gh-readonly-queue/... commit gets
  # a CI run at all: GitHub gates required checks on the merge_group event,
  # not on the pull_request run from the PR head. See ci.yml, which has the
  # same fix.
  merge_group:
  workflow_dispatch:

concurrency:
  group: openapi-extensions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect openapi-extensions changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      specs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.specs }}
    steps:
      # dorny/paths-filter reads changed files from the pull_request API, which
      # doesn't exist for a merge_group or workflow_dispatch event, so this step
      # is skipped there and the output above is forced to 'true' instead: the
      # queue and a manual dispatch always run the suite rather than
      # misdetecting an empty diff and reporting a green run that tested nothing.
      - name: Path filters
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            specs:
              - 'openapi-extensions/**'
              - '.github/workflows/openapi-extensions-ci.yml'

  validate:
    name: Validate extension schemas and examples
    needs: changes
    if: needs.changes.outputs.specs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openapi-extensions/spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r authenticated-principal/requirements.txt
      - name: Authenticated Principal schema tests
        run: python authenticated-principal/test_schema.py
      - name: Authenticated Principal examples are valid OpenAPI
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from openapi_spec_validator import validate
          root = Path('authenticated-principal/examples')
          for name in ('generic.yaml', 'google-userinfo.yaml'):
              validate(yaml.safe_load((root / name).read_text()))
          PY
      - name: Throttling validator tests
        working-directory: openapi-extensions/spec/throttling
        run: python -m unittest test_validate
      - name: Throttling example passes the validator
        working-directory: openapi-extensions/spec/throttling
        run: |
          python - <<'PY'
          import yaml
          from validate import validate
          validate(yaml.safe_load(open('examples/windowed.yaml', encoding='utf-8')))
          print('examples/windowed.yaml: throttling structure valid')
          PY
