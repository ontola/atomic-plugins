[package]
name = "atomic-integration-proxy"
version = "0.2.3"
edition = "2021"
description = "OAuth/catalog integration proxy (pinned OpenAPI catalog, connections owned by Atomic agents, Atomic v2 request signatures, delegations and frame capabilities) used by Atomic Server and LocalThought"
license = "MIT"
repository = "https://github.com/ontola/atomic-plugins"
homepage = "https://github.com/ontola/atomic-plugins/tree/main/integration-proxy"
documentation = "https://docs.rs/atomic-integration-proxy"
readme = "README.md"
keywords = ["oauth", "proxy", "openapi", "axum", "localthought"]
categories = ["web-programming::http-server", "authentication"]
# Only what the library and binary need to build. Test fixtures (tests/), the
# Heroku wrapper template (examples/) and repo-only docs stay out of the
# published crate; src/ is shipped whole so the #[cfg(test)] module
# declarations still resolve for anyone reading the source.
include = [
    "/src/**/*.rs",
    "/static/index.html",
    "/static/logo.png",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
]

[lib]
name = "atomic_integration_proxy"
path = "src/lib.rs"

[[bin]]
name = "integration-proxy"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie-private"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
url = "2"
rand = "0.8"
base64 = "0.22"
time = "0.3"
sha2 = "0.10"
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
