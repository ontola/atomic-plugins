[package]
name = "ng-atomic-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
description = "Operator-run NextGraph wallet/verifier sidecar for the Atomic Server nextgraph plugin"
publish = false

# Standalone: not a member of any workspace in this repo or in atomic-server.
[workspace]

[dependencies]
# The NextGraph Rust SDK (wallet, local verifier, broker client), pinned to an
# exact upstream commit. Cargo.lock was seeded from that commit's own lock
# file, so every shared dependency resolves to what upstream builds with.
nextgraph = { git = "https://git.nextgraph.org/NextGraph/nextgraph-rs.git", rev = "d507afa3e97197b7ded5a5e241c10dd0f12dd6d4" }
# Same commit: its SPARQL parser, to admit only INSERT DATA updates.
ng-oxigraph = { git = "https://git.nextgraph.org/NextGraph/nextgraph-rs.git", rev = "d507afa3e97197b7ded5a5e241c10dd0f12dd6d4" }
async-std = { version = "1.12.0", features = ["attributes"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"

[profile.release]
opt-level = 2
