[package]
name = "willow-verify-drop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Decodes and verifies Willow drops with the reference Rust implementation (willow25), as independent evidence for integrations/willow's drop encoder."

# Not part of any workspace in this repo, and not built by CI: run it by hand
# (see ../README.md).
[workspace]

[dependencies]
# The same exact version as ../../../willow-drop/fixtures/generate.
willow25 = { version = "=0.7.9", features = ["drop_format"] }
ufotofu = { version = "0.12.6", features = ["alloc", "std"] }
pollster = "0.4.0"
