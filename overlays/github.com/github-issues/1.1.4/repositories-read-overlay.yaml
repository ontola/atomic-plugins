overlay: 1.0.0
info:
  title: GitHub Issues repository picker read
  version: 1.0.0
# One read outside `/repos/`: the repositories the connected account can see,
# for the issue-tracker drive app's repository picker (ontola/atomic-plugins
# #147). It is a plain read, not a CRUD collection: `owner`/`repo` stay
# configuration (see crud-causality-overlay.yaml), and declaring a
# `crudResources` collection here would make Reflector enumerate and sync it.
#
# Listed in catalog.json after pagination-overlay.yaml, whose `nextLink`
# scheme it names, and it carries its own `security`, since auth-overlay.yaml
# runs before this path exists. Dropping this file's catalog line removes the
# path and nothing else.
#
# Request and response shapes follow GitHub's "List repositories for the
# authenticated user" reference
# (https://docs.github.com/en/rest/repos/repos#list-repositories-for-the-authenticated-user),
# narrowed to what the picker reads; they are not verified against a live
# account. With the `repo` scope the list includes private repositories;
# GitHub still returns the public ones without it.
actions:
  - target: $.paths
    update:
      /user/repos:
        get:
          operationId: repos-list-for-authenticated-user
          summary: List repositories for the authenticated user
          description: >-
            Repositories the authenticated user can access (owned,
            collaborator, organization member). Paginated with the RFC 8288
            `Link` header (rel="next"); at most 100 per page.
          security:
            - githubOAuth:
                - repo
          x-pagination:
            - scheme: nextLink
          parameters:
            - name: per_page
              in: query
              required: false
              schema: {type: integer, default: 30, minimum: 1, maximum: 100}
            - name: page
              in: query
              required: false
              schema: {type: integer, default: 1, minimum: 1}
            - name: sort
              in: query
              required: false
              schema:
                type: string
                enum: [created, updated, pushed, full_name]
                default: full_name
            - name: direction
              in: query
              required: false
              schema:
                type: string
                enum: [asc, desc]
          responses:
            '200':
              description: A page of repositories (a top-level array).
              headers:
                Link:
                  description: RFC 8288 pagination links; absent on the only page.
                  schema: {type: string}
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/repository'
            '304':
              description: Not modified.
            '401':
              description: Requires authentication.
            '403':
              description: Forbidden.

  - target: $.components.schemas
    update:
      repository:
        type: object
        description: >-
          A repository as the picker reads it; GitHub's full payload carries
          many more fields.
        required: [id, full_name]
        properties:
          id: {type: integer, format: int64}
          name: {type: string}
          full_name:
            type: string
            description: '`owner/name`, the value the app stores as its repository.'
          owner:
            type: object
            properties:
              login: {type: string}
          private: {type: boolean}
          has_issues:
            type: boolean
            description: Repositories with issues turned off cannot be chosen.
          open_issues_count:
            type: integer
            description: GitHub's count, which includes open pull requests.
          html_url: {type: string, format: uri}
