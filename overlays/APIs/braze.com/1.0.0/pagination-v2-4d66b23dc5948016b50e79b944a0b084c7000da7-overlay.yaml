# Revision of pagination-4d66b23dc5948016b50e79b944a0b084c7000da7-overlay.yaml.
# The pinned OpenAPI 3 OAD has no `components` member, so this revision adds
# it from the root (overlays/README.md, "Documents without components");
# operation targets are unchanged. Composition is checked against the pinned
# OAD; live-provider behavior is not certified.
overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/4d66b23dc5948016b50e79b944a0b084c7000da7/APIs/braze.com/1.0.0/openapi.yaml
info:
  title: Braze API Pagination Schemes
  version: 2.0.0
actions:
  - target: "$"
    update:
      components:
        paginationSchemes:
          page:
            type: pageNumber
            description: >-
              Many Braze list endpoints (campaigns, canvases, segments, etc.)
              use page-number pagination. `page` is zero-based (default 0) and
              `limit` controls results per page (default 100).
            request:
              queryParameters:
                page:
                  role: page
                limit:
                  role: pageSize
          offset:
            type: pageNumber
            description: >-
              Some Braze endpoints (e.g. content blocks, email templates) use
              offset-based pagination with `offset` (records to skip) and
              `limit` (max results to return).
            request:
              queryParameters:
                offset:
                  role: offset
                limit:
                  role: pageSize
