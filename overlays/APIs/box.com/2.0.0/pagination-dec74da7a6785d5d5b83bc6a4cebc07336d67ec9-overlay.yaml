overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/box.com/2.0.0/openapi.yaml
info:
  title: Box API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        offset:
          type: offset
          description: >
            Box uses offset-based pagination for many list endpoints. Pass
            `offset` and `limit` to navigate pages. The response includes
            `total_count` indicating the total number of items available.
            This is the default pagination mode (when `usemarker` is not set
            to true).
          request:
            queryParameters:
              offset:
                role: offset
                description: >
                  The offset of the item at which to begin the response.
                  Queries with offset parameter value exceeding 10000 will
                  be rejected with a 400 response. Default is 0.
              limit:
                role: pageSize
                description: >
                  The maximum number of items to return per page. Default
                  varies by endpoint, maximum is 1000.
          response:
            bodyFields:
              total_count:
                role: totalCount
                description: >
                  One greater than the offset of the last entry in the
                  entire collection. The total number of entries in the
                  collection may be less than `total_count`.
              offset:
                role: currentOffset
                description: >
                  The offset of the item at which the current page of
                  results begins.
              limit:
                role: pageSize
                description: >
                  The limit that was used for these entries. This will be
                  the same as the `limit` query parameter unless it
                  exceeded the maximum value allowed for this endpoint.
        marker:
          type: pageToken
          description: >
            Box uses marker-based pagination for large collections and
            certain endpoints (when `usemarker=true` is passed). Marker
            pagination avoids the 10,000 item offset limit. Pass the
            `next_marker` from the response as the `marker` on the next
            request. When `next_marker` is null, you have reached the
            last page.
          request:
            queryParameters:
              marker:
                role: pageToken
                description: >
                  Defines the position marker at which to begin returning
                  results. This is used when paginating using marker-based
                  pagination. Requires `usemarker=true` to be set.
              usemarker:
                role: pageTokenMode
                description: >
                  Specifies whether to use marker-based pagination instead
                  of offset-based pagination. Set to `true` to enable
                  marker-based pagination.
              limit:
                role: pageSize
                description: >
                  The maximum number of items to return per page. Default
                  varies by endpoint, maximum is 1000.
          response:
            bodyFields:
              next_marker:
                role: nextPageToken
                description: >
                  The marker for the start of the next page of results.
                  Null or absent when there are no more pages.
