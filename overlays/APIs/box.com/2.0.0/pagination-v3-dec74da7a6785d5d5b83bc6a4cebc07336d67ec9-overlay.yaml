# Reviewed 2026-10-12 against the pinned OAD and Box's documentation; no live calls.
# Source: https://developer.box.com/guides/api-calls/pagination/offset-based
# Source: https://developer.box.com/guides/api-calls/pagination/marker-based
# Source: https://developer.box.com/reference/get-files-id-collaborations (marker-based)
# Needs Pagination Schemes 0.7.0 (openapi-extensions/spec/pagination-schemes, advance).
# v3 of pagination-v2-dec74da7a6785d5d5b83bc6a4cebc07336d67ec9-overlay.yaml, which stays
# published: the same schemes and applications, plus `advance: pageSize` on the
# offset field of `boxOffset`. Box: the next offset "equals the sum of the
# previous `offset` value and limit returned in the previous result,
# `previous_offset + previous_limit`", and "the `offset` should be increased by
# the previous `limit` and not by the size of the entries in the response
# array, as this may be less than the limit". A 0.7.0 reader therefore steps by
# the `limit` the response reports and ends once the next offset reaches
# `total_count` ("One greater than the offset of the last item in the entire
# collection"; the collection "may be less than `total_count`"), not at a
# short or empty page. A reader without 0.7.0 ignores `advance` and reads as
# with v2 (see its comment for the risk). Box refuses an offset above 9999
# ("The maximum `offset` for offset-based pagination is `9999`"), so a list of
# more than 10,000 entries read by offset ends with an error. Marker lists,
# the `usemarker` lists read by offset, GET /files/{file_id}/collaborations by
# marker and the operations left out are as in v2.
overlay: 1.0.0
info:
  title: Box API pagination (offset lists advance by the limit)
  version: 3.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/box.com/2.0.0/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      boxOffset:
        type: pageNumber
        autoDetect: false
        description: Offset lists. The next offset is the previous offset plus the limit the response
          reports (advance pageSize), not plus the entries returned; the list ends once it reaches total_count,
          not at a short or empty page. Box refuses an offset above 9999.
        request:
          queryParameters:
            offset:
              role: offset
              advance: pageSize
            limit:
              role: pageSize
        response:
          envelope:
            itemsField: entries
          bodyFields:
            total_count:
              role: totalCount
            offset:
              role: offset
            limit:
              role: pageSize
      boxMarker:
        type: pageToken
        autoDetect: false
        description: Marker lists. Send next_marker back as marker; a null or absent next_marker ends
          the list.
        request:
          queryParameters:
            marker:
              role: cursor
            limit:
              role: pageSize
        response:
          envelope:
            itemsField: entries
          bodyFields:
            next_marker:
              role: nextCursor
      boxMarkerNoLimit:
        type: pageToken
        autoDetect: false
        description: Marker lists without a limit parameter in the pinned OAD.
        request:
          queryParameters:
            marker:
              role: cursor
        response:
          envelope:
            itemsField: entries
          bodyFields:
            next_marker:
              role: nextCursor
- target: $.paths['/collaborations'].get
  update:
    x-pagination:
    - scheme: boxOffset
