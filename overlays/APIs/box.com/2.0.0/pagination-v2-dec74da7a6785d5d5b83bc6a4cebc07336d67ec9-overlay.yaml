# Reviewed 2026-10-12 against the pinned OAD and Box's documentation; no live calls.
# Source: https://developer.box.com/guides/api-calls/pagination/offset-based
# Source: https://developer.box.com/guides/api-calls/pagination/marker-based
# Source: https://developer.box.com/reference/get-files-id-collaborations (marker-based)
# Replaces pagination-dec74da7a6785d5d5b83bc6a4cebc07336d67ec9-overlay.yaml, which stays published: that
# revision declares `type: offset` and the roles `currentOffset` and
# `pageTokenMode`, which Pagination Schemes does not define, and applies them
# by auto-detection only; a consumer that leaves invalid schemes out of
# auto-detection (syncables does) reads each Box list as one page.
#
# Every GET whose pinned parameters include `offset` or `marker` and whose
# 200 response has `entries` is applied explicitly; nothing is auto-detected.
# Offset lists (`offset`, `limit`, `total_count` in the pinned response):
# pageNumber with the `offset` role. Box: "The maximum `offset` for
# offset-based pagination is `9999`", so a list of more than 10,000 entries
# read this way fails at the request past that offset (Box answers 400)
# rather than ending early. `total_count` is "One greater than the offset of
# the last item in the entire collection", and the collection "may be less
# than `total_count`". The three lists that take both (`usemarker`:
# folder items, trash items, users) are read by offset too: marker paging
# there needs `usemarker=true`, a fixed value no scheme field carries.
# Marker lists: pageToken, `marker` sent back from `next_marker`; "The
# final page of items has been requested when the next `next_marker` value
# is `null`". GET /files/{file_id}/collaborations is marker-based per Box's
# reference, although the pinned response schema shows offset fields.
# Not applied: GET /events (stream positions) and GET /search.
overlay: 1.0.0
info:
  title: Box API pagination (offset and marker lists, explicit)
  version: 2.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/box.com/2.0.0/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      boxOffset:
        type: pageNumber
        autoDetect: false
        description: Offset lists. The next offset is the current one plus the limit; the list ends when
          it reaches total_count. Box refuses an offset above 9999.
        request:
          queryParameters:
            offset:
              role: offset
            limit:
              role: pageSize
        response:
          envelope:
            itemsField: entries
          bodyFields:
            total_count:
              role: totalCount
            offset:
              role: offset
            limit:
              role: pageSize
      boxMarker:
        type: pageToken
        autoDetect: false
        description: Marker lists. Send next_marker back as marker; a null or absent next_marker ends
          the list.
        request:
          queryParameters:
            marker:
              role: cursor
            limit:
              role: pageSize
        response:
          envelope:
            itemsField: entries
          bodyFields:
            next_marker:
              role: nextCursor
      boxMarkerNoLimit:
        type: pageToken
        autoDetect: false
        description: Marker lists without a limit parameter in the pinned OAD.
        request:
          queryParameters:
            marker:
              role: cursor
        response:
          envelope:
            itemsField: entries
          bodyFields:
            next_marker:
              role: nextCursor
- target: $.paths['/collaborations'].get
  update:
    x-pagination:
    - scheme: boxOffset
