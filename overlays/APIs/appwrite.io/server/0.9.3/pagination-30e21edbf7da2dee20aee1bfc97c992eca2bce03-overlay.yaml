overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/30e21edbf7da2dee20aee1bfc97c992eca2bce03/APIs/appwrite.io/server/0.9.3/openapi.yaml
info:
  title: Appwrite Server API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        offset:
          type: pageNumber
          description: >-
            Appwrite uses offset-based pagination across all list endpoints.
            `limit` controls the number of results (default 25, max 100) and
            `offset` sets the starting position (default 0).
          request:
            queryParameters:
              limit:
                role: pageSize
              offset:
                role: offset
