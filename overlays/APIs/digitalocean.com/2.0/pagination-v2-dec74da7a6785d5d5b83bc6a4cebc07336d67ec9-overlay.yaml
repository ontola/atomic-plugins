# Source: https://docs.digitalocean.com/reference/api/reference/public-apis/
# Verified against the pinned OAD; live-provider behavior is not certified.
overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/digitalocean.com/2.0/openapi.yaml
info:
  title: DigitalOcean linked pages with operation-specific item envelopes
  version: 2.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        linkedPages:
          type: nextLink
          autoDetect: false
          description: Follow links.pages.next as the complete next-page URL, preserving its
            query parameters. Its absence marks the last page. This also preserves page_token
            on repository listings instead of synthesizing a page number.
          request:
            queryParameters:
              per_page:
                role: pageSize
          response:
            bodyFields:
              links.pages.next:
                role: nextLink
              meta.total:
                role: totalCount
  - target: $.paths['/v2/account/keys'].get
    update:
      x-pagination:
        - scheme: linkedPages
          overrides:
            response:
              envelope:
                itemsField: ssh_keys
