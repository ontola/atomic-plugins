overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/bdea260b91b4c49605ff3aa287e916031b80ca29/APIs/clever.com/1.2.0/openapi.yaml
info:
  title: Clever Data API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        cursor:
          type: pageToken
          description: >-
            Clever uses cursor-based pagination. Pass an item ID as
            `starting_after` to fetch the next page of results (items
            appearing after that ID), or `ending_before` to fetch the
            previous page. `limit` controls the page size.
          request:
            queryParameters:
              starting_after:
                role: pageToken
              limit:
                role: pageSize
