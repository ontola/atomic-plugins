# Reviewed 2026-10-06 against the pinned OAD and official provider documentation.
# Source: https://developer.squareup.com/docs/build-basics/common-api-patterns/pagination
overlay: 1.0.0
info:
  title: Square explicit query and body collection cursors
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/e15e761285c715a9035dee558ff40c8f3bd3f796/APIs/squareup.com/2.0/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      queryCursor:
        type: pageToken
        autoDetect: false
        description: Return the opaque response cursor on the next request, keeping filters and sorting.
          Stop when cursor is absent or empty. Cursors expire after five minutes; page-size limits are
          operation-specific.
        request:
          queryParameters:
            cursor:
              role: cursor
        response:
          bodyFields:
            cursor:
              role: nextCursor
      bodyCursor:
        type: pageToken
        autoDetect: false
        description: Return the opaque response cursor on the next request, keeping filters and sorting.
          Stop when cursor is absent or empty. Cursors expire after five minutes; page-size limits are
          operation-specific.
        request:
          bodyFields:
            cursor:
              role: cursor
        response:
          bodyFields:
            cursor:
              role: nextCursor
      merchantCursor:
        type: pageToken
        autoDetect: false
        description: Return the integer response cursor as the cursor query parameter without incrementing
          it. Stop when the provider omits cursor. The pinned merchant endpoint has no limit parameter.
        request:
          queryParameters:
            cursor:
              role: cursor
              schema:
                type: integer
        response:
          envelope:
            itemsField: merchant
          bodyFields:
            cursor:
              role: nextCursor
              schema:
                type: integer
