- target: $.components
  update:
    paginationSchemes:
      linkedCollections:
        type: nextLink
        autoDetect: false
        description: Follow the returned next_page_uri, which keeps the resource scope, filters, PageSize
          and the PageToken. It is an absolute-path reference relative to https://api.twilio.com (Pagination
          Schemes 0.4.0 linkResolution, base server). Stop when it is null, empty or absent; never increment
          Page or construct a PageToken. Do not follow uri, first_page_uri or previous_page_uri as the
          forward continuation.
        request:
          queryParameters:
            PageSize:
              role: pageSize
        response:
          bodyFields:
            next_page_uri:
              role: nextLink
              linkResolution:
                base: server
