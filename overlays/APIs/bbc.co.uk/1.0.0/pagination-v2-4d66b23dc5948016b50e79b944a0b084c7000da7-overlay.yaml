overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/4d66b23dc5948016b50e79b944a0b084c7000da7/APIs/bbc.co.uk/1.0.0/swagger.yaml
info:
  title: BBC My Account & Metadata API Pagination Schemes
  version: 2.0.0
actions:
- target: "$"
  update:
    x-paginationSchemes:
      offset:
        type: pageNumber
        description: >-
          Zero-based offset/limit pagination. The response echoes `limit`
          and `offset` and reports the total match count as `total`.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
        response:
          bodyFields:
            limit:
              role: pageSize
            offset:
              role: offset
            total:
              role: totalCount
      offsetRequestOnly:
        type: pageNumber
        description: >-
          Same request parameters as `offset`, but these endpoints return
          a job-status object rather than a paginated results envelope.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
