# Reviewed 2026-10-08 against the pinned OAD and official provider documentation.
# Source: https://developer.moneybird.com/introduction (Throttling)
# Needs Throttling 0.2.0-draft (openapi-extensions/spec/throttling, headers and signals).
# Supersedes throttling-85a6105220036a98ef0d7cd6f228d4aae0036508-overlay.yaml (same limits), which stays published.
overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/85a6105220036a98ef0d7cd6f228d4aae0036508/APIs/moneybird.com/v2-readonly/openapi.yaml
info:
  title: Moneybird announced API throttling, headers and signals
  version: 2.0.0
actions:
  - target: $
    update:
      x-throttling:
        limits:
          apiRequests:
            requests: 150
            window:
              seconds: 300
              kind: unspecified
            partitionBy: [sourceIp]
            description: >-
              Moneybird counts API requests per source IP. Other clients sharing
              that address also use the quota. The developer guide does not
              specify fixed or sliding windows. Report endpoints have a stricter
              quota and are outside this read-only source-record catalog.
        applies: [apiRequests]
        headers:
          Retry-After:
            role: retryAfter
            unit: deltaSecondsOrHttpDate
            description: >-
              Moneybird documents it as "the time after which a new request can
              be made"; its encoding is the standard RFC 9110 one. Moneybird
              also sends RateLimit-Remaining, RateLimit-Limit and
              RateLimit-Reset, but documents no units for them (and calls
              RateLimit-Remaining a time), so they are not declared.
        signals:
          - status: [429]
            meaning: quotaExhausted
            bucket: apiRequests
            description: >-
              Moneybird answers 429 Too many requests when a quota is used up.
              The bucket is apiRequests because this pinned read-only OAD has
              no /reports/ endpoints, whose separate 50-per-5-minutes limit
              would make a 429 ambiguous.
