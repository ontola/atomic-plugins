# Reviewed 2026-10-14 against the pinned OAD; no live calls. developer.moneybird.com renders
# client-side and could not be read, so the evidence is the pinned document alone ("Generated
# from the official Moneybird OpenAPI v2 specification").
# Source: the pinned OAD's list parameters, whose documented defaults leave out records that
#   still exist: `filter` default "period:this_year" (documents, estimates, external and
#   sales invoices, time entries), "state:active" (projects, recurring sales invoices),
#   "unbatched:true" (purchase transactions); `active` default true (assets: "Whether to
#   include only active assets"; products: "When true, only active products are returned");
#   contacts list archived contacts only with include_archived.
# Source: the pinned OAD's item reads, whose 404 is documented only as "Not found".
# Needs Collection Completeness 0.2.0-draft (notFound). Compose after
# crud-causality-85a61052...-overlay.yaml, in either order: it deep-merges into its
# resources.
#
# absent: removed. A record can leave a list's default read while it still exists (a new
# year, an archived contact, a finished project), so absence is never a deletion by itself;
# the record's own read settles it. A query override in the catalog's selection (which
# widens those defaults) does not change that.
# notFound: unavailable. Without a declaration a consumer takes a 404 from a record's read
# as a deletion (the notFound default); the document says only "Not found", which does not
# tell a deleted record from one the caller cannot read, so a 404 is unavailable.
# Declared on the 20 collections whose resource has an item read with that 404. Not
# declared: financial_mutations (capped at 100 with no page parameter: a read is complete
# only through the range-window overlay, not yet on main); subscriptions (listed per contact
# through a contact_id query the collection does not model); the resources without an item
# read (absence could never be settled). No `gone` (no 410 documented) and no
# `parentAbsent` (no administration resource).
# Not verified: what any read answers for a deleted record.
