overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dc4bd462cdef2a11865274027de251b5b1f3d854/APIs/codat.io/accounting/2.1.0/openapi.yaml
info:
  title: Codat Accounting API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageNumber:
          type: pageNumber
          description: >-
            Codat uses page-number pagination across all list endpoints.
            `page` specifies the 1-based page number and `pageSize` controls
            the number of results per page. The response includes `pageNumber`,
            `pageSize`, and `totalResults` for navigation context.
          request:
            queryParameters:
              page:
                role: page
              pageSize:
                role: pageSize
          response:
            bodyFields:
              pageNumber:
                role: currentPage
              pageSize:
                role: pageSize
              totalResults:
                role: totalCount
