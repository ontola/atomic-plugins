# Reviewed 2026-10-05 against the pinned OAD and official documentation.
# Source: https://mailchimp.com/developer/marketing/docs/methods-parameters/#pagination
# Explicit selections require declared request fields, continuation/count fields and item arrays.
overlay: 1.0.0
info:
  title: Mailchimp explicit collection pagination
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/b6b0af39fa9d35f81fbea6b7962cc6dea857e889/APIs/mailchimp.com/3.0.91/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      offsetPages:
        type: pageNumber
        autoDetect: false
        description: Start offset at 0 and advance by the returned item count; total_items counts all
          matching items. Preserve filters. Partial-response fields/exclude_fields must retain the item
          array and total_items.
        request:
          queryParameters:
            offset:
              role: offset
            count:
              role: pageSize
        response:
          bodyFields:
            total_items:
              role: totalCount
- target: $.paths['/activity-feed/chimp-chatter'].get
  update:
    x-pagination:
    - scheme: offsetPages
      overrides:
        response:
          envelope:
            itemsField: chimp_chatter
