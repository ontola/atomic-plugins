overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/api2cart.com/1.1/openapi.yaml
info:
  title: Api2Cart API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      offset:
        type: pageNumber
        description: >-
          Offset-based pagination. Cannot be combined with page_cursor
          on the same request.
        request:
          queryParameters:
            start:
              role: offset
            count:
              role: pageSize
      cursor:
        type: pageToken
        description: >-
          Cursor-based pagination, mutually exclusive with start/count
          on the same request. The response's pagination.next field
          carries the cursor value to pass back as page_cursor.
        request:
          queryParameters:
            page_cursor:
              role: pageToken
        response:
          bodyFields:
            pagination.next:
              role: nextPageToken
      cursorRequestOnly:
        type: pageToken
        description: >-
          Same as cursor, but this endpoint's response schema doesn't
          model a pagination envelope.
        request:
          queryParameters:
            page_cursor:
              role: pageToken
- target: "$.paths['/cart.catalog_price_rules.list.json'].get"
