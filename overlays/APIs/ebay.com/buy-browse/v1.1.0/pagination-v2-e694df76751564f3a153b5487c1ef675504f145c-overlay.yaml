# Swagger 2.0 revision of pagination-e694df76751564f3a153b5487c1ef675504f145c-overlay.yaml.
# The pinned OAD has no `components`, so the paginationSchemes map is the root
# `x-paginationSchemes` vendor extension (overlays/README.md, "Swagger 2.0 documents");
# operation targets are unchanged. Composition is checked against the pinned
# OAD; live-provider behavior is not certified.
overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/e694df76751564f3a153b5487c1ef675504f145c/APIs/ebay.com/buy-browse/v1.1.0/swagger.yaml
info:
  title: eBay Buy Browse API Pagination Schemes
  version: 2.0.0
actions:
- target: "$"
  update:
    x-paginationSchemes:
      offset:
        type: pageNumber
        description: >-
          eBay's standard offset/limit pagination. The response echoes
          limit/offset, reports the total match count, and includes a
          next-page URI when further results are available.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
        response:
          bodyFields:
            total:
              role: totalCount
            next:
              role: nextLink
            limit:
              role: pageSize
- target: "$.paths['/item_summary/search'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/item_summary/search_by_image'].post"
  update:
    x-pagination:
    - scheme: offset
