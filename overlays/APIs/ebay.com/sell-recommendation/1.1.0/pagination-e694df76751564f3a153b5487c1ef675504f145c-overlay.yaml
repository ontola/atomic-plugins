overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/e694df76751564f3a153b5487c1ef675504f145c/APIs/ebay.com/sell-recommendation/1.1.0/openapi.yaml
info:
  title: eBay Listing Recommendations API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      offset:
        type: pageNumber
        description: >-
          eBay's standard offset/limit pagination. The response echoes
          limit/offset, reports the total match count, and includes a
          next-page URI when further results are available.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
        response:
          bodyFields:
            total:
              role: totalCount
            next:
              role: nextLink
            limit:
              role: pageSize
- target: "$.paths['/find'].post"
  update:
    x-pagination:
    - scheme: offset
