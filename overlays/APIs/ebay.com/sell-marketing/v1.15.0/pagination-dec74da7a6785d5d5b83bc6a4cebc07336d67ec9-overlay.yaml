overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/ebay.com/sell-marketing/v1.15.0/openapi.yaml
info:
  title: eBay Sell Marketing API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      offset:
        type: pageNumber
        description: >-
          eBay's standard offset/limit pagination. The response echoes
          limit/offset, reports the total match count, and includes a
          next-page URI when further results are available.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
        response:
          bodyFields:
            total:
              role: totalCount
            next:
              role: nextLink
            limit:
              role: pageSize
- target: "$.paths['/ad_campaign'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/ad_campaign/{campaign_id}/ad'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/ad_campaign/{campaign_id}/ad_group'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/ad_campaign/{campaign_id}/keyword'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/ad_campaign/{campaign_id}/suggest_items'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/ad_report_task'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/negative_keyword'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/promotion'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/promotion/{promotion_id}/get_listing_set'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/promotion_report'].get"
  update:
    x-pagination:
    - scheme: offset
