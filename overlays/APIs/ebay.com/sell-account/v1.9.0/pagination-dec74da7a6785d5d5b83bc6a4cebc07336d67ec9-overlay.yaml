overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/ebay.com/sell-account/v1.9.0/openapi.yaml
info:
  title: eBay Sell Account API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      cursor:
        type: pageToken
        description: >-
          Cursor-based pagination via continuation_token. The response
          reports the total match count and includes a next-page URI
          when further results are available.
        request:
          queryParameters:
            limit:
              role: pageSize
            continuation_token:
              role: pageToken
        response:
          bodyFields:
            total:
              role: totalCount
            next:
              role: nextLink
            limit:
              role: pageSize
- target: "$.paths['/subscription'].get"
  update:
    x-pagination:
    - scheme: cursor
