overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/436f35b2ab0734ff9df0a0b55db2b00c52af8234/APIs/ebay.com/sell-feed/v1.3.1/openapi.yaml
info:
  title: eBay Sell Feed API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      offset:
        type: pageNumber
        description: >-
          eBay's standard offset/limit pagination. The response echoes
          limit/offset, reports the total match count, and includes a
          next-page URI when further results are available.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
        response:
          bodyFields:
            total:
              role: totalCount
            next:
              role: nextLink
            limit:
              role: pageSize
- target: "$.paths['/customer_service_metric_task'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/inventory_task'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/order_task'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/schedule'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/schedule_template'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/task'].get"
  update:
    x-pagination:
    - scheme: offset
