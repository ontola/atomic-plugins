# Reviewed 2026-10-06 against the pinned OAD and official provider documentation.
# Source: https://developer.atlassian.com/cloud/confluence/rest/v2/intro/
overlay: 1.0.0
info:
  title: Confluence v2 linked collections
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/5e659825c92ed8d1284b63cdc84a94a0c51d7217/APIs/atlassian.com/confluence-v2/2.0.0/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      linkedResults:
        type: nextLink
        autoDetect: false
        description: Follow only rel="next" from the RFC 8288 Link response header. Resolve relative link
          targets against the request URL; preserve the returned cursor and filters. Stop when no next
          relation is supplied.
        request:
          queryParameters:
            limit:
              role: pageSize
        response:
          envelope:
            itemsField: results
          headers:
            Link:
              role: nextLink
- target: $.paths['/attachments'].get
  update:
    x-pagination:
    - scheme: linkedResults
