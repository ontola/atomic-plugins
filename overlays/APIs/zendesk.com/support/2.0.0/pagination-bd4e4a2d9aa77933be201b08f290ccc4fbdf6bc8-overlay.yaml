# Reviewed 2026-10-06 against the pinned OAD and official provider documentation.
# Source: https://developer.zendesk.com/documentation/api-basics/pagination/paginating-through-lists-using-offset-pagination/
overlay: 1.0.0
info:
  title: Zendesk Support ordinary offset collection links
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/bd4e4a2d9aa77933be201b08f290ccc4fbdf6bc8/APIs/zendesk.com/support/2.0.0/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      linkedCollections:
        type: nextLink
        autoDetect: false
        description: Follow the complete next_page URL, including filters and page size. A null next_page
          ends traversal. This overlay selects ordinary offset-mode collections with declared page/per_page
          fields, not cursor-mode or incremental export streams. Offset pagination is limited to the first
          10000 records by the provider.
        request: {}
        response:
          bodyFields:
            next_page:
              role: nextLink
- target: $.paths['/api/v2/activities'].get
  update:
    x-pagination:
    - scheme: linkedCollections
      overrides:
        response:
          envelope:
            itemsField: activities
        request:
          queryParameters:
            per_page:
              role: pageSize
