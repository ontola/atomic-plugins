overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/949c40c36f1dba1f3d1a9272aefa977cfa12a43b/APIs/azure.com/resources/2019-10-01/swagger.yaml
info:
  title: Azure Resources API Pagination Schemes
  version: 2.0.0
actions:
  - target: "$"
    update:
      x-paginationSchemes:
        nextLink:
          type: nextLink
          description: >-
            Azure Resource Manager list operations use nextLink-style
            pagination (x-ms-pageable). When a response includes a `nextLink`
            field, follow that URL to retrieve the next page of results.
          autoDetect:
            matchQueryParams: false
            matchBodyFields: false
            matchResponseFields: true
            requireAll: false
          response:
            bodyFields:
              nextLink:
                role: nextLink
