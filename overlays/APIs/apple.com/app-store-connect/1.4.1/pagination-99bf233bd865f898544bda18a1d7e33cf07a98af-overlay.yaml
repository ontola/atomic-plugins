overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/99bf233bd865f898544bda18a1d7e33cf07a98af/APIs/apple.com/app-store-connect/1.4.1/openapi.yaml
info:
  title: App Store Connect API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      cursor:
        type: pageToken
        description: >-
          App Store Connect paginates list endpoints with an opaque
          limit-bounded cursor embedded in the links.next URL (there is
          no separate cursor query parameter to set directly - clients
          follow links.next as-is). The response meta.paging object
          echoes the effective limit and reports the total match count.
        request:
          queryParameters:
            limit:
              role: pageSize
        response:
          bodyFields:
            links.next:
              role: nextLink
            meta.paging.total:
              role: totalCount
            meta.paging.limit:
              role: pageSize
- target: "$.paths['/v1/appCategories'].get"
  update:
    x-pagination:
    - scheme: cursor
