overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/4d66b23dc5948016b50e79b944a0b084c7000da7/APIs/freesound.org/2.0.0/swagger.yaml
info:
  title: Freesound API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      pageNumber:
        type: pageNumber
        request:
          queryParameters:
            page:
              role: page
            page_size:
              role: pageSize
- target: "$.paths['/search/text'].get"
  update:
    x-pagination:
    - scheme: pageNumber
