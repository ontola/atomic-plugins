overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/2914e6bed4db4389921b36e4ed79e645c2085668/APIs/spotify.com/1.0.0-readonly/openapi.yaml
info:
  title: Spotify Web API Playlist CRUD Causality
  version: 1.0.0
# The initial Spotify integration is deliberately read-only. A playlist is
# listed from the authenticated user's collection and read by its Spotify ID.
actions:
  - target: $.components
    update:
      crudResources:
        playlist:
          schema:
            $ref: '#/components/schemas/SimplifiedPlaylist'
          description: A playlist visible to the authenticated Spotify user.
          identity:
            urlTemplate: /playlists/{playlist_id}
            bindings:
              playlist_id:
                field: id
          collections:
            playlists:
              urlTemplate: /me/playlists

  - target: $.paths['/me/playlists'].get
    update:
      x-crud:
        action: list
        resource: playlist
        collection: playlists
  - target: $.paths['/playlists/{playlist_id}'].get
    update:
      x-crud:
        action: read
        resource: playlist
