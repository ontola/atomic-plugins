# Reviewed 2026-10-14 against the pinned OAD and official provider documentation; no live calls.
# Source: https://developer.spotify.com/documentation/web-api/concepts/playlists ("We have no
#   endpoint for deleting a playlist in the Web API; the notion of deleting a playlist is not
#   relevant within the Spotify's playlist system."; "Even if you are the playlist's owner and
#   you choose to manually remove it from your own list of playlists, you are simply
#   unfollowing it."; restoring a deleted playlist "is the same thing as following one of your
#   own playlists that you have previously unfollowed"; private playlists are listed only with
#   playlist-read-private and collaborative ones only with playlist-read-collaborative).
# Source: https://developer.spotify.com/documentation/web-api/concepts/api-calls: 404 "Not
#   Found - The requested resource could not be found. This error can be due to a temporary or
#   permanent condition." No 410 is listed.
# Source: the pinned OAD's GET /me/playlists: "Get playlists owned or followed by the current
#   Spotify user." The pinned OAD (an authored subset) declares no 404 for either operation.
# Needs Collection Completeness 0.2.0-draft (notFound). Compose after
# crud-causality-2914e6be...-overlay.yaml, in either order: it deep-merges into its `playlist`
# resource. The catalog's auth overlay requests both playlist scopes, so the list covers
# private and collaborative playlists.
#
# Without a declaration a consumer takes a 404 from a playlist's own read as a deletion (the
# notFound default). Spotify has no playlist deletion, and says a 404 can be temporary, so a
# 404 is unavailable. A playlist leaves the user's list when unfollowed, which is all a
# "delete" in the Spotify apps is; it still exists for its other followers and can be
# followed again, so absence is removed and settled by the playlist's own read.
# Not declared: `gone` (no 410 listed); no `parentAbsent` (the list has no path variable).
# Not verified: what a playlist's read answers after its owner unfollows it.
overlay: 1.0.0
info:
  title: Spotify current user's playlists collection completeness
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/2914e6bed4db4389921b36e4ed79e645c2085668/APIs/spotify.com/1.0.0-readonly/openapi.yaml
actions:
  - target: $.components
    update:
      crudResources:
        playlist:
          collections:
            playlists:
              x-completeness:
                absent: removed
                notFound: unavailable
                description: >-
                  The playlists the current user owns or follows, every page.
                  Spotify has no playlist deletion: a playlist leaves the list
                  when the user unfollows it, and it can be followed again, so
                  absence is removed. A 404 "can be due to a temporary or
                  permanent condition", so a 404 from a playlist's own read is
                  unavailable.
