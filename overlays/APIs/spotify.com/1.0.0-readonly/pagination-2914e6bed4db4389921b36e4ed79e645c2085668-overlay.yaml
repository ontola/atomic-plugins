overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/2914e6bed4db4389921b36e4ed79e645c2085668/APIs/spotify.com/1.0.0-readonly/openapi.yaml
info:
  title: Spotify Web API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        offset:
          type: pageNumber
          description: >
            Spotify playlist collections use offset-based pagination. The
            response contains `next`, `total`, and the current page's `limit`.
          request:
            queryParameters:
              limit:
                role: pageSize
              offset:
                role: offset
          response:
            bodyFields:
              next:
                role: nextLink
              total:
                role: totalCount
              limit:
                role: pageSize
