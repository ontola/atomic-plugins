# Reviewed 2026-10-15 against the pinned OAD and official provider documentation; no live calls.
# Source: https://developers.asana.com/docs/pagination ("When making paginated requests, you
#   are able to "page through" all objects for a particular query up to 100 objects at a time.
#   Alternatively, your query will be truncated at about 1,000 objects.")
# Source: the pinned OAD: each of the four lists declares `limit` ("The number of objects to
#   return per page. The value must be between 1 and 100.").
# Needs CRUD Causality 0.4.0 (listQuery, §4.2.1).
#
# Revision 2 of crud-causality-b58c91d9...: every resource, collection, envelope and
# operation of v1, plus a fixed `listQuery: {limit: '100'}` on each of the four collections.
# Without `limit` Asana does not paginate, and a list longer than about 1,000 objects comes
# back truncated with no next_page, so a reader would take a cut-off list as complete. With
# it the read pages through every object, 100 at a time, by the pagination overlay's
# cursorData scheme (whose `limit` field is the pageSize; CRUD Causality §4.2.1 lets a
# listQuery give that field the read's default page size). v1 stays published.
overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/b58c91d9f59c6a10178916e7948793809edae46d/APIs/asana.com/1.0/openapi.yaml
info:
  title: Asana read-only CRUD causality (revision 2)
  version: 2.0.0
  description: >-
    Read-only resources for workspace, project, task, and user discovery.
    Response envelopes and identifiers follow the pinned Asana OAD.
actions:
- target: $.components
  update:
    crudResources:
      workspace:
        schema:
          $ref: '#/components/schemas/WorkspaceCompact'
        description: An Asana workspace accessible to the connected user.
        identity:
          urlTemplate: /workspaces/{workspace_gid}
          bindings:
            workspace_gid:
              field: gid
        collections:
          workspaces:
            urlTemplate: /workspaces
            envelope:
              itemsField: data
            listQuery:
              limit: '100'
      project:
        schema:
          $ref: '#/components/schemas/ProjectCompact'
        description: An Asana project in an accessible workspace.
        identity:
          urlTemplate: /projects/{project_gid}
          bindings:
            project_gid:
              field: gid
        collections:
          workspaceProjects:
            urlTemplate: /workspaces/{workspace_gid}/projects
            envelope:
              itemsField: data
            listQuery:
              limit: '100'
      task:
        schema:
          $ref: '#/components/schemas/TaskCompact'
        description: A task in an accessible project.
        identity:
          urlTemplate: /tasks/{task_gid}
          bindings:
            task_gid:
              field: gid
        collections:
          projectTasks:
            urlTemplate: /projects/{project_gid}/tasks
            envelope:
              itemsField: data
            listQuery:
              limit: '100'
      user:
        schema:
          $ref: '#/components/schemas/UserCompact'
        description: An Asana user visible to the connected account.
        identity:
          urlTemplate: /users/{user_gid}
          bindings:
            user_gid:
              field: gid
        collections:
          users:
            urlTemplate: /users
            envelope:
              itemsField: data
            listQuery:
              limit: '100'
- target: $.paths['/workspaces'].get
  update:
    x-crud:
      action: list
      resource: workspace
      collection: workspaces
- target: $.paths['/workspaces/{workspace_gid}'].get
  update:
    x-crud:
      action: read
      resource: workspace
- target: $.paths['/workspaces/{workspace_gid}/projects'].get
  update:
    x-crud:
      action: list
      resource: project
      collection: workspaceProjects
- target: $.paths['/projects/{project_gid}'].get
  update:
    x-crud:
      action: read
      resource: project
- target: $.paths['/projects/{project_gid}/tasks'].get
  update:
    x-crud:
      action: list
      resource: task
      collection: projectTasks
- target: $.paths['/tasks/{task_gid}'].get
  update:
    x-crud:
      action: read
      resource: task
- target: $.paths['/users'].get
  update:
    x-crud:
      action: list
      resource: user
      collection: users
- target: $.paths['/users/{user_gid}'].get
  update:
    x-crud:
      action: read
      resource: user
