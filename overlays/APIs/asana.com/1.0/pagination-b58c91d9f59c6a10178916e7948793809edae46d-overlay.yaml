# Reviewed 2026-10-06 against the pinned OAD and official provider documentation.
# Source: https://developers.asana.com/docs/pagination
overlay: 1.0.0
info:
  title: Asana ordinary collection cursors
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/b58c91d9f59c6a10178916e7948793809edae46d/APIs/asana.com/1.0/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      cursorData:
        type: pageToken
        autoDetect: false
        description: Specify limit to enable pagination and return the opaque next_page.offset token through
          offset. Preserve filters and opt_fields. Stop when next_page is null; tokens expire. The audit-log
          stream is deliberately outside this ordinary collection scheme.
        request:
          queryParameters:
            offset:
              role: cursor
            limit:
              role: pageSize
              required: true
        response:
          envelope:
            itemsField: data
          bodyFields:
            next_page.offset:
              role: nextCursor
- target: $.paths['/workspaces/{workspace_gid}/agents'].get
  update:
    x-pagination:
    - scheme: cursorData
