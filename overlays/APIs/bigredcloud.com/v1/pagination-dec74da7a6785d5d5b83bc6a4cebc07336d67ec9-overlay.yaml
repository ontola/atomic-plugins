overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/bigredcloud.com/v1/openapi.yaml
info:
  title: BigRedCloud API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        nextLink:
          type: nextLink
          description: >-
            BigRedCloud uses hypermedia-style pagination via a `NextPageLink`
            response body field. When the field is non-empty, it contains the
            full URL for the next page of results. The `Count` field indicates
            the number of items returned in the current page.
          autoDetect:
            matchQueryParams: false
            matchBodyFields: false
            matchResponseFields: true
            requireAll: false
          response:
            bodyFields:
              NextPageLink:
                role: nextLink
