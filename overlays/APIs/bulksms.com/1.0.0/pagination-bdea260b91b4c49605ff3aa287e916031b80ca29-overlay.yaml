overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/bdea260b91b4c49605ff3aa287e916031b80ca29/APIs/bulksms.com/1.0.0/openapi.yaml
info:
  title: BulkSMS API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        cursor:
          type: pageToken
          description: >-
            BulkSMS uses ID-based cursor pagination. Pass the minimum record
            `id` using `min-id` to fetch records from that ID onwards. `limit`
            controls the maximum number of records returned (default 1000,
            max 10000).
          request:
            queryParameters:
              min-id:
                role: pageToken
              limit:
                role: pageSize
