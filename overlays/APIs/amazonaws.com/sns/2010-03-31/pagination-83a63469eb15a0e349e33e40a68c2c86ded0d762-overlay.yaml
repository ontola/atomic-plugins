overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/83a63469eb15a0e349e33e40a68c2c86ded0d762/APIs/amazonaws.com/sns/2010-03-31/openapi.yaml
info:
  title: AWS SNS API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        nextToken:
          type: pageToken
          description: >-
            SNS list operations (e.g. ListTopics, ListSubscriptions,
            ListEndpointsByPlatformApplication) use NextToken-based pagination.
            Pass the `NextToken` from the previous response to retrieve the
            next page of results.
          request:
            queryParameters:
              NextToken:
                role: pageToken
          response:
            bodyFields:
              NextToken:
                role: nextPageToken
