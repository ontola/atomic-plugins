overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/83a63469eb15a0e349e33e40a68c2c86ded0d762/APIs/amazonaws.com/kinesis/2013-12-02/openapi.yaml
info:
  title: AWS Kinesis API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        nextToken:
          type: pageToken
          description: >-
            Kinesis list operations (e.g. ListStreams, ListShards) use
            NextToken-based pagination. The `NextToken` body parameter
            continues pagination from the previous response, and `Limit`
            controls the maximum number of results returned.
          request:
            bodyFields:
              NextToken:
                role: pageToken
              Limit:
                role: pageSize
          response:
            bodyFields:
              NextToken:
                role: nextPageToken
