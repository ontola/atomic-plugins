overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/59562d52b3919331b10d239a105c0ac10506d182/APIs/amazonaws.com/elasticache/2015-02-02/openapi.yaml
info:
  title: AWS ElastiCache API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        marker:
          type: pageToken
          description: >-
            ElastiCache Describe operations use Marker-based pagination via
            query parameters. `Marker` (from the previous response) indicates
            the starting position for the next page. `MaxRecords` limits the
            number of records returned per request.
          request:
            queryParameters:
              Marker:
                role: pageToken
              MaxRecords:
                role: pageSize
          response:
            bodyFields:
              Marker:
                role: nextPageToken
