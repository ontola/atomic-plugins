overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/855ad4d3cf72432549f87d2a0a65f99bc7d38e68/APIs/amazonaws.com/ec2/2016-11-15/openapi.yaml
info:
  title: AWS EC2 API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        nextToken:
          type: pageToken
          description: >-
            EC2 Describe/List operations use token-based pagination. `MaxResults`
            limits results per request and `NextToken` (from the previous
            response) continues pagination. When the response omits `NextToken`,
            all results have been retrieved.
          request:
            queryParameters:
              MaxResults:
                role: pageSize
              NextToken:
                role: pageToken
          response:
            bodyFields:
              NextToken:
                role: nextPageToken
