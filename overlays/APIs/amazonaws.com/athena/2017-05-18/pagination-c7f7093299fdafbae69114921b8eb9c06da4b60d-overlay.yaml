overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/c7f7093299fdafbae69114921b8eb9c06da4b60d/APIs/amazonaws.com/athena/2017-05-18/openapi.yaml
info:
  title: AWS Athena API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        nextToken:
          type: pageToken
          description: >-
            Athena list operations (e.g. ListQueryExecutions, ListNamedQueries,
            ListDataCatalogs) use NextToken-based pagination. `MaxResults`
            limits the results per request and `NextToken` (from the previous
            response) continues pagination.
          request:
            queryParameters:
              MaxResults:
                role: pageSize
              NextToken:
                role: pageToken
          response:
            bodyFields:
              NextToken:
                role: nextPageToken
