overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/callfire.com/V2/openapi.yaml
info:
  title: CallFire API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      offset:
        type: pageNumber
        description: >-
          Offset/limit pagination. The response wraps results as a Page
          object: {items, limit, offset, totalCount}. totalCount is -1
          when the total is unknown.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
        response:
          bodyFields:
            totalCount:
              role: totalCount
            limit:
              role: pageSize
      offsetRequestOnly:
        type: pageNumber
        description: >-
          Same request parameters as offset, but this endpoint's
          response (a bundle of a contact's calls and texts) doesn't
          echo a pagination envelope.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
- target: "$.paths['/calls'].get"
  update:
    x-pagination:
    - scheme: offset
