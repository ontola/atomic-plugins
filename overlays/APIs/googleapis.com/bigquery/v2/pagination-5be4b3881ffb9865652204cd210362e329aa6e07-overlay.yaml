overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/5be4b3881ffb9865652204cd210362e329aa6e07/APIs/googleapis.com/bigquery/v2/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              pageToken:
                role: pageToken
              maxResults:
                role: pageSize
          response:
            bodyFields:
              nextPageToken:
                role: nextPageToken
        offset:
          type: pageNumber
          request:
            queryParameters:
              startIndex:
                role: offset
              maxResults:
                role: pageSize
