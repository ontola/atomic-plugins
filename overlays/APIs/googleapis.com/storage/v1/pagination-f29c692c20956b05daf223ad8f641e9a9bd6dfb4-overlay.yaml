# Reviewed 2026-10-06 against the pinned OAD and official provider documentation.
# Source: https://docs.cloud.google.com/storage/docs/json_api/v1/objects/list
overlay: 1.0.0
info:
  title: Google Cloud Storage v1 ordinary collection pagination
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/f29c692c20956b05daf223ad8f641e9a9bd6dfb4/APIs/googleapis.com/storage/v1/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      forwardPages:
        type: pageToken
        autoDetect: false
        description: Send the opaque nextPageToken as pageToken on the next request. Stop only when nextPageToken
          is absent or empty, not when a page is short or empty. If using fields, include the continuation
          and item array. Keep project, bucket, prefix, projection, versions and other filters fixed.
          A token does not guarantee a snapshot if objects are created during traversal. Object listing
          uses flat mode without delimiter; the alternative prefixes array is outside the selected item
          envelope. Watch registration is outside this variant.
        request:
          queryParameters:
            pageToken:
              role: cursor
        response:
          bodyFields:
            nextPageToken:
              role: nextCursor
- target: $.paths['/b'].get
  update:
    x-pagination:
    - scheme: forwardPages
      overrides:
        request:
          queryParameters:
            maxResults:
              role: pageSize
        response:
          envelope:
            itemsField: items
- target: $.paths['/b/{bucket}/o'].get
  update:
    x-pagination:
    - scheme: forwardPages
      overrides:
        request:
          queryParameters:
            maxResults:
              role: pageSize
        response:
          envelope:
            itemsField: items
      description: 'Flat object listing only: omit delimiter and includeFoldersAsPrefixes. Page items;
        prefixes is a separate directory-mode collection outside this application.'
- target: $.paths['/b/{bucket}/operations'].get
  update:
    x-pagination:
    - scheme: forwardPages
      overrides:
        request:
          queryParameters:
            pageSize:
              role: pageSize
        response:
          envelope:
            itemsField: operations
- target: $.paths['/projects/{projectId}/hmacKeys'].get
  update:
    x-pagination:
    - scheme: forwardPages
      overrides:
        request:
          queryParameters:
            maxResults:
              role: pageSize
        response:
          envelope:
            itemsField: items
