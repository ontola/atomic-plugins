{
  "overlay": "1.0.0",
  "info": {
    "title": "Google Drive file inventory",
    "version": "1.0.0"
  },
  "extends": "https://raw.githubusercontent.com/ontola/openapi-directory/a7dd2d8b4f5f50794e51afd84c539c2e61a182fc/APIs/googleapis.com/drive/v3/openapi.yaml",
  "actions": [
    {
      "target": "$.components.securitySchemes",
      "update": {
        "driveMetadata": {
          "type": "oauth2",
          "x-oauth-authentication-details": {
            "authorizationServerMetadata": {
              "token_endpoint_auth_methods_supported": [
                "client_secret_post"
              ],
              "code_challenge_methods_supported": [
                "S256"
              ]
            },
            "authorizationCode": {
              "pkce": {
                "requirement": "optional"
              },
              "profile": {
                "parameters": [
                  {
                    "parameter": {
                      "name": "access_type",
                      "in": "query",
                      "schema": {
                        "type": "string",
                        "enum": [
                          "offline"
                        ]
                      }
                    },
                    "value": "offline"
                  }
                ],
                "capabilities": [
                  "offlineAccess"
                ]
              }
            }
          },
          "flows": {
            "authorizationCode": {
              "authorizationUrl": "https://accounts.google.com/o/oauth2/v2/auth",
              "tokenUrl": "https://oauth2.googleapis.com/token",
              "scopes": {
                "https://www.googleapis.com/auth/drive.metadata.readonly": "Read Drive file metadata"
              }
            }
          }
        }
      }
    },
    {
      "target": "$.components",
      "update": {
        "paginationSchemes": {
          "driveChanges": {
            "type": "pageToken",
            "autoDetect": false,
            "request": {
              "queryParameters": {
                "pageToken": {
                  "role": "cursor"
                }
              }
            },
            "response": {
              "bodyFields": {
                "nextPageToken": {
                  "role": "nextCursor"
                }
              },
              "envelope": {
                "itemsField": "changes"
              }
            }
          }
        },
        "crudResources": {
          "driveFile": {
            "identity": {
              "urlTemplate": "/files/{fileId}",
              "bindings": {
                "fileId": {
                  "field": "id"
                }
              }
            },
            "collections": {
              "files": {
                "urlTemplate": "/files",
                "listQuery": {
                  "fields": "nextPageToken,incompleteSearch,files(id,name,mimeType,parents,size,modifiedTime,version,headRevisionId,md5Checksum,sha1Checksum,sha256Checksum,trashed)"
                },
                "envelope": {
                  "itemsField": "files"
                }
              }
            }
          }
        }
      }
    },
    {
      "target": "$.paths['/files'].get",
      "update": {
        "security": [
          {
            "driveMetadata": [
              "https://www.googleapis.com/auth/drive.metadata.readonly"
            ]
          }
        ]
      }
    },
    {
      "target": "$.paths['/changes'].get",
      "update": {
        "security": [
          {
            "driveMetadata": [
              "https://www.googleapis.com/auth/drive.metadata.readonly"
            ]
          }
        ],
        "x-pagination": [
          {
            "scheme": "driveChanges"
          }
        ]
      }
    },
    {
      "target": "$.paths['/changes/startPageToken'].get",
      "update": {
        "security": [
          {
            "driveMetadata": [
              "https://www.googleapis.com/auth/drive.metadata.readonly"
            ]
          }
        ]
      }
    }
  ]
}
