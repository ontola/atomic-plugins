# Reviewed 2026-10-08 against the pinned OAD and official provider documentation.
# Source: https://developers.google.com/workspace/admin/directory/reference/rest/v1/users/list
overlay: 1.0.0
info:
  title: Google directory collection pagination
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/fdc294bd8f2520f4cef3491726d86b603b5cf946/APIs/googleapis.com/admin/directory_v1/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      forwardPages:
        type: pageToken
        autoDetect: false
        description: 'Send opaque nextPageToken as pageToken. Stop only when nextPageToken is absent or
          empty, not when a page is short or empty. If using fields, include nextPageToken and the item
          array. Preserve customer/domain/group scope, queries, projection masks, sorting, deleted selection
          and derived membership flags. Ordinary user listing only: omit event; watch registration is
          outside this variant. Users-list page tokens are valid for three days, not durable sync checkpoints.'
        request:
          queryParameters:
            pageToken:
              role: cursor
        response:
          bodyFields:
            nextPageToken:
              role: nextCursor
- target: $.paths['/admin/directory/v1/customer/{customerId}/devices/chromeos'].get
  update:
    x-pagination:
    - scheme: forwardPages
      overrides:
        response:
          envelope:
            itemsField: chromeosdevices
        request:
          queryParameters:
            maxResults:
              role: pageSize
- target: $.paths['/admin/directory/v1/customer/{customerId}/devices/mobile'].get
