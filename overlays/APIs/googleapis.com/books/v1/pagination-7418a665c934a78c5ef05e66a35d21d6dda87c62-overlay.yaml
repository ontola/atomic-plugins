overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/7418a665c934a78c5ef05e66a35d21d6dda87c62/APIs/googleapis.com/books/v1/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              pageToken:
                role: pageToken
              maxResults:
                role: pageSize
          response:
            bodyFields:
              nextToken:
                role: nextPageToken
