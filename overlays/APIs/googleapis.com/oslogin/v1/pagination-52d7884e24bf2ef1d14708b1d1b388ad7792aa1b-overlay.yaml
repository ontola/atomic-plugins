overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/52d7884e24bf2ef1d14708b1d1b388ad7792aa1b/APIs/googleapis.com/oslogin/v1/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              pageToken:
                role: pageToken
              pageSize:
                role: pageSize
          response:
            bodyFields:
              nextPageToken:
                role: nextPageToken
