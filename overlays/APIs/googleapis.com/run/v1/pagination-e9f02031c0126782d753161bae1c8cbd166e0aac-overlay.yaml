overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/e9f02031c0126782d753161bae1c8cbd166e0aac/APIs/googleapis.com/run/v1/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              pageToken:
                role: pageToken
              pageSize:
                role: pageSize
          response:
            bodyFields:
              nextPageToken:
                role: nextPageToken
        continue:
          type: pageToken
          request:
            queryParameters:
              continue:
                role: pageToken
              limit:
                role: pageSize
          response:
            bodyFields:
              nextPageToken:
                role: nextPageToken
