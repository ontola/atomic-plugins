# Google Keep OAuth profile for the Google Keep drive app
# (integrations/google-keep/). It selects the four operations the app uses
# with the full keep scope (the app writes: a row made or edited in the drive
# becomes a note). The Keep API has no update; an edit is a create and a
# delete, so delete is included.
#
# The pinned OAD names get and delete under /v1/{name}, whose {name} is a
# resource name with a slash (notes/<id>). integration-proxy matches a path
# segment by segment (catalog.rs path_matches), so /v1/notes/<id> would never
# match /v1/{name}. This overlay adds the same two operations under
# /v1/notes/{note}, with {note} the bare id; the upstream URL is the same.
# /v1/{name} itself is left as it is (the proxy knows only update actions)
# and gets no profile security, so the profile does not select it.
#
# Google offers the Keep API to Google Workspace accounts only; a personal
# account's consent ends in invalid_scope. No live connection has been made.
overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/091431739208d017c11b0b0589ab33293f8b3690/APIs/googleapis.com/keep/v1/openapi.yaml
info:
  title: Google Keep v1 OAuth profile (notes read and write)
  version: 1.0.0
actions:
  - target: $.components.securitySchemes
    update:
      googleKeepOAuth:
        type: oauth2
        x-oauth-authentication-details:
          authorizationServerMetadata:
            token_endpoint_auth_methods_supported:
              - client_secret_post
              - client_secret_basic
            code_challenge_methods_supported:
              - S256
          authorizationCode:
            pkce:
              requirement: optional
            profile:
              parameters:
                - parameter:
                    name: access_type
                    in: query
                    schema:
                      type: string
                      enum:
                        - offline
                  value: offline
            capabilities:
              - offlineAccess
            tokenIssuance:
              refreshToken:
                presence: conditional
                conditions:
                  - firstAuthorization
                description: Google can omit a refresh token after the first authorization.
        flows:
          authorizationCode:
            authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
            tokenUrl: https://oauth2.googleapis.com/token
            scopes:
              https://www.googleapis.com/auth/keep: See, edit, create and permanently delete all your Google Keep data.
  - target: $.components
    update:
      x-authentication-profiles:
        googleKeep:
          securityScheme: googleKeepOAuth
          description: List, read, create and delete the connected person's Google Keep notes.
  - target: $.paths['/v1/notes'].get
    update:
      security:
        - googleKeepOAuth:
            - https://www.googleapis.com/auth/keep
  - target: $.paths['/v1/notes'].post
    update:
      security:
        - googleKeepOAuth:
            - https://www.googleapis.com/auth/keep
  - target: $.paths
    update:
      /v1/notes/{note}:
        parameters:
          - $ref: "#/components/parameters/_.xgafv"
          - $ref: "#/components/parameters/access_token"
          - $ref: "#/components/parameters/alt"
          - $ref: "#/components/parameters/callback"
          - $ref: "#/components/parameters/fields"
          - $ref: "#/components/parameters/key"
          - $ref: "#/components/parameters/oauth_token"
          - $ref: "#/components/parameters/prettyPrint"
          - $ref: "#/components/parameters/quotaUser"
          - $ref: "#/components/parameters/upload_protocol"
          - $ref: "#/components/parameters/uploadType"
        get:
          description: Gets a note (keep.notes.get, as /v1/{name} with name notes/{note}).
          operationId: keep.notes.get.byId
          parameters:
            - description: The note's id, the part of its resource name after notes/.
              in: path
              name: note
              required: true
              schema:
                type: string
          responses:
            "200":
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Note"
              description: Successful response
          security:
            - googleKeepOAuth:
                - https://www.googleapis.com/auth/keep
          tags:
            - notes
        delete:
          description: Deletes a note for good (keep.notes.delete, as /v1/{name} with name notes/{note}). Caller must have the OWNER role on the note. It cannot be undone.
          operationId: keep.notes.delete.byId
          parameters:
            - description: The note's id, the part of its resource name after notes/.
              in: path
              name: note
              required: true
              schema:
                type: string
          responses:
            "200":
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Empty"
              description: Successful response
          security:
            - googleKeepOAuth:
                - https://www.googleapis.com/auth/keep
          tags:
            - notes
