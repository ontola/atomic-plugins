# Reviewed 2026-10-08 against the pinned OAD and official provider documentation.
# Source: https://developers.google.com/workspace/vault/reference/rest/v1/matters/list
overlay: 1.0.0
info:
  title: Google vault collection pagination
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/98a453ea8cce0b5723f2f95d376720c304632d23/APIs/googleapis.com/vault/v1/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      forwardPages:
        type: pageToken
        autoDetect: false
        description: Send opaque nextPageToken as pageToken. Stop only when nextPageToken is absent or
          empty, not when a page is short or empty. If using fields, include nextPageToken and the item
          array. Preserve matterId, state and view. List operations page matter, hold, saved-query and
          export metadata; they do not download exported content or start searches/exports. Long-running
          operation polling is outside this selection.
        request:
          queryParameters:
            pageToken:
              role: cursor
        response:
          bodyFields:
            nextPageToken:
              role: nextCursor
- target: $.paths['/v1/matters'].get
  update:
    x-pagination:
    - scheme: forwardPages
      overrides:
        response:
          envelope:
            itemsField: matters
        request:
          queryParameters:
            pageSize:
              role: pageSize
- target: $.paths['/v1/matters/{matterId}/exports'].get
  update:
    x-pagination:
    - scheme: forwardPages
      overrides:
        response:
          envelope:
            itemsField: exports
        request:
          queryParameters:
            pageSize:
              role: pageSize
- target: $.paths['/v1/matters/{matterId}/holds'].get
  update:
    x-pagination:
    - scheme: forwardPages
      overrides:
        response:
          envelope:
            itemsField: holds
        request:
          queryParameters:
            pageSize:
              role: pageSize
- target: $.paths['/v1/matters/{matterId}/savedQueries'].get
  update:
    x-pagination:
    - scheme: forwardPages
      overrides:
        response:
          envelope:
            itemsField: savedQueries
        request:
          queryParameters:
            pageSize:
              role: pageSize
