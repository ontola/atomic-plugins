overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/576a346680d8d137de5e215ac209596e6449081b/APIs/googleapis.com/androidpublisher/v2/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              token:
                role: pageToken
              maxResults:
                role: pageSize
          response:
            bodyFields:
              token:
                role: nextPageToken
