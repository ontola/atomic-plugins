overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/18b0eb0bf56a67cf596937fbe97b7500a58d90fe/APIs/googleapis.com/dfareporting/v4/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              pageToken:
                role: pageToken
              maxResults:
                role: pageSize
          response:
            bodyFields:
              nextPageToken:
                role: nextPageToken
