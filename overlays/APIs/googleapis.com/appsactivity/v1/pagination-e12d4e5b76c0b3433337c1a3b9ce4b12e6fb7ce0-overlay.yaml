overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/e12d4e5b76c0b3433337c1a3b9ce4b12e6fb7ce0/APIs/googleapis.com/appsactivity/v1/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              pageToken:
                role: pageToken
              maxResults:
                role: pageSize
          response:
            bodyFields:
              nextPageToken:
                role: nextPageToken
