overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/a8f5cd34022a9ff3b6e0ac89426a5bf8fc6531f5/APIs/googleapis.com/cloudbuild/v1alpha2/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              pageToken:
                role: pageToken
              pageSize:
                role: pageSize
          response:
            bodyFields:
              nextPageToken:
                role: nextPageToken
