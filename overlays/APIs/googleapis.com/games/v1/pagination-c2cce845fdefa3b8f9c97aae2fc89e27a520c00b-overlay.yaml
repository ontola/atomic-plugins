overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/c2cce845fdefa3b8f9c97aae2fc89e27a520c00b/APIs/googleapis.com/games/v1/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              pageToken:
                role: pageToken
              maxResults:
                role: pageSize
          response:
            bodyFields:
              nextPageToken:
                role: nextPageToken
