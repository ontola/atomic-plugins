overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/433a94f3e9e268f2b000b0b497785ede34332a7f/APIs/googleapis.com/dlp/v2/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              pageToken:
                role: pageToken
              pageSize:
                role: pageSize
          response:
            bodyFields:
              nextPageToken:
                role: nextPageToken
