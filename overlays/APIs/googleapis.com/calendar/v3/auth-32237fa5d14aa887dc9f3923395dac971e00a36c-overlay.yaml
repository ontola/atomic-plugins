overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/32237fa5d14aa887dc9f3923395dac971e00a36c/APIs/googleapis.com/calendar/v3/openapi.yaml
info:
  title: google-calendar OAuth authorization requirements
  version: 1.3.0
actions:
- target: $.components.securitySchemes
  update:
    googleOnline:
      type: oauth2
      x-oauth-authentication-details:
        authorizationServerMetadata:
          token_endpoint_auth_methods_supported:
          - client_secret_post
          - client_secret_basic
          code_challenge_methods_supported:
          - S256
        authorizationCode:
          pkce:
            requirement: optional
          profile:
            parameters:
            - parameter:
                name: access_type
                in: query
                schema:
                  type: string
                  enum:
                  - online
                  - offline
              value: online
            tokenIssuance:
              refreshToken:
                presence: never
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/calendar.events: View and edit events
              on calendars.
            https://www.googleapis.com/auth/calendar.calendarlist.readonly: View the
              calendars to which the user is subscribed.
    googleOffline:
      type: oauth2
      x-oauth-authentication-details:
        authorizationServerMetadata:
          token_endpoint_auth_methods_supported:
          - client_secret_post
          - client_secret_basic
          code_challenge_methods_supported:
          - S256
        authorizationCode:
          pkce:
            requirement: optional
          profile:
            parameters:
            - parameter:
                name: access_type
                in: query
                schema:
                  type: string
                  enum:
                  - online
                  - offline
              value: offline
            capabilities:
            - offlineAccess
            tokenIssuance:
              refreshToken:
                presence: conditional
                conditions:
                - firstAuthorization
                description: Google can omit a refresh token after the first authorization.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/calendar.events: View and edit events
              on calendars.
            https://www.googleapis.com/auth/calendar.calendarlist.readonly: View the
              calendars to which the user is subscribed.
- target: $.paths['/calendars/{calendarId}/events'].get
  update:
    security:
    - googleOnline:
      - https://www.googleapis.com/auth/calendar.events
    - googleOffline:
      - https://www.googleapis.com/auth/calendar.events
- target: $.paths['/calendars/{calendarId}/events/{eventId}'].get
  update:
    security:
    - googleOnline:
