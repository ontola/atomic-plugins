# The base document (now the full, generated googleapis.com/calendar/v3
# document — see catalog.json) already declares this `patch` operation in
# full: operationId, parameters, and a requestBody/200 response both typed
# as `#/components/schemas/Event`. It only needs narrowing to the one scope
# this platform actually requests (its own `security` lists every scope
# alternative Google's Discovery doc allows) and a `412` response, which
# Discovery's format has no room to express, documenting the optimistic-
# concurrency conflict Devonian's lens (`applyCalendarEdit` in
# localthought/devonian) handles via `If-Match`/ETag. Reuses the
# `calendar.events` scope already requested for the events GET operations
# above, so no new consent/reconnect is required.
- target: $.paths['/calendars/{calendarId}/events/{eventId}'].patch
  update:
    security:
    - googleOnline:
      - https://www.googleapis.com/auth/calendar.events
    - googleOffline:
      - https://www.googleapis.com/auth/calendar.events
    responses:
      '412':
        description: >
          The If-Match precondition failed: the event changed remotely
          since it was last read.

# The rest of the base document's operations (calendar/ACL/color/
# freebusy/settings/channel management this platform never calls) still
# only declare the base document's native Oauth2/Oauth2c security, which
# this catalog's oauth_provider() resolution (integration-proxy's
# Provider::from_document) requires every operation to narrow to a single
# declared scheme. Narrowed to whichever of this platform's two granted
# scopes best fits: calendarList operations to calendar.calendarlist.readonly,
# everything else to calendar.events. Catalog::allows() checks path/method
# existence only, not x-crud, so this does widen what the proxy will forward
# — Google's own per-scope enforcement on the actual granted token remains
# the real authorization boundary for all of these; devonian's lens never
# calls them.
