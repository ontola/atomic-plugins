overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/f7e40dc91b19ccfd5a2f5cc61ec841c6be23fe2a/APIs/googleapis.com/domains/v1beta1/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              pageToken:
                role: pageToken
              pageSize:
                role: pageSize
          response:
            bodyFields:
              nextPageToken:
                role: nextPageToken
