overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/8920ab0acd150a43fe98733f6149b59ca4587407/APIs/googleapis.com/rapidmigrationassessment/v1/openapi.yaml
info:
  title: Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageToken:
          type: pageToken
          request:
            queryParameters:
              pageToken:
                role: pageToken
              pageSize:
                role: pageSize
          response:
            bodyFields:
              nextPageToken:
                role: nextPageToken
