# Reviewed 2026-10-12 against the pinned OAD and official provider documentation; no live calls.
# Source: https://developers.google.com/workspace/tasks/reference/rest/v1/tasks/list
# Source: https://protobuf.dev/programming-guides/json/ (empty repeated fields are omitted)
# Needs Pagination Schemes 0.7.0 (openapi-extensions/spec/pagination-schemes, emptyWhenAbsent).
# v2 of pagination-7ca47c73cf2308c9812692b482b3713b397bc88c-overlay.yaml, which stays
# published: the same schemes and applications, plus emptyWhenAbsent on both
# envelopes. An empty task list or list of task lists is expected to come back
# without `items`: JSON serialized with the Protocol Buffers JSON mapping
# leaves an empty repeated field out, the Task reference documents the same
# style for its own fields ("This field is omitted if the task has not been
# completed"), and the google-tasks drive app (integrations/google-tasks/app/
# read.ts) reads an absent `items` as an empty list. Declared, not verified:
# the Tasks reference does not say what an empty list returns, and no live
# empty list was read. A present `items` that is not an array is still an error.
overlay: 1.0.0
info:
  title: Google Tasks v1 ordinary collection pagination (absent items is an empty page)
  version: 2.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/7ca47c73cf2308c9812692b482b3713b397bc88c/APIs/googleapis.com/tasks/v1/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      forwardPages:
        type: pageToken
        autoDetect: false
        description: Send the opaque nextPageToken as pageToken on the next request. Stop only when nextPageToken
          is absent or empty, not when a page is short or empty. If using fields, include the continuation
          and item array. Keep tasklist, due/completed/updated filters and showCompleted/showHidden/showDeleted
          flags fixed. Default task filters do not include every completed or hidden task; pagination
          does not widen the requested scope.
        request:
          queryParameters:
            pageToken:
              role: cursor
        response:
          bodyFields:
            nextPageToken:
              role: nextCursor
- target: $.paths['/tasks/v1/lists/{tasklist}/tasks'].get
  update:
    x-pagination:
    - scheme: forwardPages
      overrides:
        request:
          queryParameters:
            maxResults:
              role: pageSize
        response:
          envelope:
            itemsField: items
            emptyWhenAbsent: true
- target: $.paths['/tasks/v1/users/@me/lists'].get
  update:
    x-pagination:
    - scheme: forwardPages
      overrides:
        request:
          queryParameters:
            maxResults:
              role: pageSize
        response:
          envelope:
            itemsField: items
            emptyWhenAbsent: true
