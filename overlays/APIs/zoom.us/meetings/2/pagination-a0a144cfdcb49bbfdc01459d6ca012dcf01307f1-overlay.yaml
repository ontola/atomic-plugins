# Reviewed 2026-10-06 against the pinned OAD and official provider documentation.
# Source: https://developers.zoom.us/docs/api/meetings/
overlay: 1.0.0
info:
  title: Zoom Meetings explicit token collections
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/a0a144cfdcb49bbfdc01459d6ca012dcf01307f1/APIs/zoom.us/meetings/2/openapi.yaml
actions:
- target: $.components
  update:
    paginationSchemes:
      tokenCollections:
        type: pageToken
        autoDetect: false
        description: Return next_page_token unchanged, keeping all filters and date ranges fixed. Stop
          when the token is absent or empty; tokens expire after 15 minutes. For endpoints that normalize
          a requested date range, callers must reuse the returned effective range before continuing. Deprecated
          page_number is not selected.
        request:
          queryParameters:
            next_page_token:
              role: cursor
            page_size:
              role: pageSize
        response:
          bodyFields:
            next_page_token:
              role: nextCursor
- target: $.paths['/archive_files'].get
  update:
    x-pagination:
    - scheme: tokenCollections
      overrides:
        response:
          envelope:
            itemsField: meetings
          bodyFields:
            total_records:
              role: totalCount
      description: If Zoom clamps to to the current time, reuse the response to value along with next_page_token;
        this extension has no role for copying non-pagination response filters.
- target: $.paths['/archive_files/download_audit'].get
  update:
