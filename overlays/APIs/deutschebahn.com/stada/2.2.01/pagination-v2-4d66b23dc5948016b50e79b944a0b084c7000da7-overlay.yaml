overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/4d66b23dc5948016b50e79b944a0b084c7000da7/APIs/deutschebahn.com/stada/2.2.01/swagger.yaml
info:
  title: Deutsche Bahn Station Data (STADA) API Pagination Schemes
  version: 2.0.0
actions:
  - target: "$"
    update:
      x-paginationSchemes:
        offset:
          type: pageNumber
          description: >-
            The Deutsche Bahn STADA API uses offset-based pagination. `offset`
            sets the starting position for results (default 0) and `limit`
