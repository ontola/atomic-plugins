overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/4d66b23dc5948016b50e79b944a0b084c7000da7/APIs/chompthis.com/1.0.0-oas3/openapi.yaml
info:
  title: ChompThis API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      pageNumber:
        type: pageNumber
        description: >-
          ChompThis paginates search results with a fixed page size chosen
          via `limit` (1-10, default 10) and a 1-based `page` number.
        request:
          queryParameters:
            page:
              role: page
            limit:
              role: pageSize
- target: "$.paths['/food/branded/name.php'].get"
  update:
    x-pagination:
    - scheme: pageNumber
- target: "$.paths['/food/branded/search.php'].get"
  update:
    x-pagination:
    - scheme: pageNumber
