overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/e19ad6a65d7f82932806d8ece6e62f1bba3e8502/APIs/hubapi.com/cms/v3/openapi.yaml
info:
  title: HubSpot CMS API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        cursor:
          type: pageToken
          description: >-
            HubSpot CMS APIs use cursor-based pagination. Pass the value of
            `paging.next.after` from the previous response as the `after`
            query parameter. The response also includes a `total` count.
          request:
            queryParameters:
              after:
                role: pageToken
              limit:
                role: pageSize
          response:
            bodyFields:
              total:
                role: totalCount
