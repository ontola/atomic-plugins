overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/4d66b23dc5948016b50e79b944a0b084c7000da7/APIs/globalwinescore.com/8234aab51481d37a30757d925b7f4221a659427e/openapi.yaml
info:
  title: GlobalWineScore API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      offset:
        type: pageNumber
        description: >-
          GlobalWineScore uses offset/limit pagination. The response
          envelope reports the total item count and `next`/`previous`
          links for navigation.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
        response:
          bodyFields:
            count:
              role: totalCount
            next:
              role: nextLink
- target: "$.paths['/globalwinescores/'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/globalwinescores/latest/'].get"
  update:
    x-pagination:
    - scheme: offset
