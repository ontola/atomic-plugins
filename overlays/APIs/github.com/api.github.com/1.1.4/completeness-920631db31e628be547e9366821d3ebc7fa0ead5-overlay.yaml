# Reviewed 2026-10-15 against the pinned OAD and official provider documentation; no live calls.
# Quotes checked word for word against the raw pages with curl.
# Source: https://docs.github.com/en/rest/issues/issues?apiVersion=2022-11-28#get-an-issue
#   ("The API returns a 301 Moved Permanently status if the issue was transferred to another
#   repository. If the issue was transferred to or deleted from a repository where the
#   authenticated user lacks read access, the API returns a 404 Not Found status. If the issue
#   was deleted from a repository where the authenticated user has read access, the API
#   returns a 410 Gone status.")
# Source: same page, "List repository issues": state "Default: `open`"; the crud-causality
#   overlays fix state=all for the issues collection. 'For this reason, "Issues" endpoints
#   may return both issues and pull requests in the response.'
# Source: same page, "Create an issue": "If issues are disabled in the repository, the API
#   returns a 410 Gone status." That is documented for the create only. That an issue's own
#   read also answers 410 while issues are disabled, and with what body, is not verified;
#   it is assumed here, and the owner can switch issues back on, so a 410 is not declared a
#   deletion (no gone: deleted).
# Source: https://docs.github.com/en/rest/using-the-rest-api/using-pagination-in-the-rest-api
#   (its issues example's next link is `issues?per_page=2&page=2`): the list pages by page
#   number.
# Needs Collection Completeness 0.2.0-draft (notFound, parentAbsent). Compose after
# crud-causality-v2-920631db...-overlay.yaml (or v1), in either order: it deep-merges into
# components.crudResources. The same declaration as the github-issues document's
# completeness-9c5cfb87...-overlay.yaml (#534), for the full api.github.com document; only
# its paging sentence is stated more exactly here.
overlay: 1.0.0
info:
  title: GitHub REST API issues collection completeness
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/920631db31e628be547e9366821d3ebc7fa0ead5/APIs/github.com/api.github.com/1.1.4/openapi.yaml
actions:
  - target: $.components
    update:
      crudResources:
        issue:
          collections:
            issues:
              x-completeness:
                absent: removed
                notFound: unavailable
                description: >-
                  With state=all (the collection's fixed read) every page
                  returns every issue and pull request of the repository,
                  open and closed. An issue leaves it when transferred to
                  another repository or deleted, so absence is removed. Its
                  own read then answers 301 (transferred), 404 (transferred or
                  deleted where the caller lacks read access) or 410 (deleted
                  where the caller has read access). GitHub documents a 410
                  for a create while issues are disabled in the repository;
                  whether a read answers 410 then is not verified, and issues
                  can be switched back on. A 404 may be a transfer and a 410
                  may be disabled issues, so both are unavailable; no gone is
                  declared. The list is paged
                  by page number: an issue deleted or transferred during a
                  read moves the later ones back one place, so the issue after
                  it on the next page can be skipped. That issue still exists;
                  it is absent from the read only, and its own read finds it.
        issueComment:
          collections:
            issueComments:
              x-completeness:
                absent: removed
                notFound: unavailable
                parentAbsent: unavailable
                description: >-
                  Every comment of the issue. A comment leaves it when
                  deleted, or the whole collection moves when its issue is
                  transferred; GitHub does not document what a 404 from
                  reading one comment means beyond "not found", so it is
                  unavailable. When the issue itself is concluded gone, its
                  comments are unavailable.
