overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/9c5cfb87b3f8b64e11069373a73e3fc85de0de5e/APIs/github.com/github-issues/1.1.4/openapi.yaml
info:
  title: GitHub supplied record relationships with durable typed identities
  version: 1.0.0
# No provider requests or recursive expansion are implied by these declarations.
# Numeric user identity is documented at:
# https://docs.github.com/en/rest/users/users#get-a-user-using-their-id
# Mutable byLogin/repository address references remain navigation-only.
# Labels remain raw: their name-based transport address does not establish a
# durable label identity in this catalog.
actions:
- target: $.components
  update:
    crudResources:
      githubRepository:
        x-embeddedResources:
          owner:
            representation: object
            cardinality: one
            discriminator:
              field: type
              mapping:
                User: githubUser
                Organization: githubOrganization
      issue:
        x-embeddedResources:
          user:
            representation: object
            resource: githubUser
            cardinality: one
      issueComment:
        x-embeddedResources:
          user:
            representation: object
            resource: githubUser
            cardinality: one
      githubUser:
        description: A supplied GitHub user representation identified by its durable
          numeric account id. Login is mutable. This declaration establishes no
          enumerable collection, target fetch, or completeness of embedded data.
        schema:
          $ref: '#/components/schemas/catalogGithubUser'
        identity:
          urlTemplate: /user/{account_id}
          bindings:
            account_id:
              field: id
    schemas:
      catalogGithubUser:
        type: object
        title: Users
        description: Fields supplied in GitHub user summaries. An embedded summary
          may be partial; omitted fields are not invented or deleted.
        required:
        - id
        - login
        properties:
          id:
            type: integer
            format: int64
            title: ID
          login:
            type: string
            title: Login
          type:
            type: string
            title: Account type
          avatar_url:
            type: string
            format: uri
            title: Avatar
          html_url:
            type: string
            format: uri
            title: Profile
