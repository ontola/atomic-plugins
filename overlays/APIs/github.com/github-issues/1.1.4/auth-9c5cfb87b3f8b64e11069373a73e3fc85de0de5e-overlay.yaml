overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/9c5cfb87b3f8b64e11069373a73e3fc85de0de5e/APIs/github.com/github-issues/1.1.4/openapi.yaml
info:
  title: github-issues OAuth authorization requirements
  version: 1.1.0
actions:
- target: $.components.securitySchemes
  update:
    githubOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://github.com/login/oauth/authorize
          tokenUrl: https://github.com/login/oauth/access_token
          scopes:
            repo: Access public and private repositories, including issues and comments.
- target: $.paths['/repos/{owner}/{repo}/issues'].get
  update:
    security:
    - githubOAuth:
      - repo
- target: $.paths['/repos/{owner}/{repo}/issues'].post
  update:
    security:
    - githubOAuth:
      - repo
- target: $.paths['/repos/{owner}/{repo}/issues/comments/{comment_id}'].delete
  update:
    security:
    - githubOAuth:
      - repo
- target: $.paths['/repos/{owner}/{repo}/issues/comments/{comment_id}'].get
  update:
    security:
    - githubOAuth:
      - repo
- target: $.paths['/repos/{owner}/{repo}/issues/comments/{comment_id}'].patch
  update:
    security:
    - githubOAuth:
      - repo
- target: $.paths['/repos/{owner}/{repo}/issues/{issue_number}'].get
  update:
    security:
    - githubOAuth:
      - repo
- target: $.paths['/repos/{owner}/{repo}/issues/{issue_number}'].patch
  update:
    security:
    - githubOAuth:
      - repo
- target: $.paths['/repos/{owner}/{repo}/issues/{issue_number}/comments'].get
  update:
    security:
    - githubOAuth:
      - repo
- target: $.paths['/repos/{owner}/{repo}/issues/{issue_number}/comments'].post
  update:
    security:
    - githubOAuth:
      - repo
