info:
  title: AlerterSystem API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      pageNumber:
        type: pageNumber
        description: >-
          API Platform-generated collection endpoints, 1-based `page`
          parameter. The default JSON representation is a bare array;
          the API also offers an `application/ld+json` representation
          with Hydra pagination metadata (hydra:totalItems,
          hydra:view.hydra:next, etc.), which isn't described here since
          it is a distinct response representation from the default one.
        request:
          queryParameters:
            page:
              role: page
