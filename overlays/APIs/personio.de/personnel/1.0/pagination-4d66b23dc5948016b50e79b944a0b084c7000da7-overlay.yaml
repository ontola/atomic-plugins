overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/4d66b23dc5948016b50e79b944a0b084c7000da7/APIs/personio.de/personnel/1.0/openapi.yaml
info:
  title: Personio Personnel API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        offset:
          type: offset
          description: >
            The Personio Personnel API uses offset-based pagination on
            collection endpoints such as attendances, time-offs, and
            time-off-types. Pass `limit` to control how many records are
            returned per page (default 200, minimum 1) and `offset` to skip
            a number of records from the beginning of the result set
            (default 0).
          request:
            queryParameters:
              limit:
                role: pageSize
                description: >
                  Maximum number of records to return per request. Defaults
                  to 200. Minimum is 1.
              offset:
                role: offset
                description: >
                  Number of records to skip from the start of the result
                  set. Defaults to 0. Increment by `limit` to fetch
                  successive pages.
