extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/apigee.net/marketcheck-cars/2.01/openapi.yaml
info:
  title: MarketCheck Cars API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      pageNumber:
        type: pageNumber
        description: >-
          Despite its name, `start` is documented as a 1-based page number
          ("Page number to fetch the results for the given criteria"), not
          an item offset. `rows` is the page size (default 10, max 50).
          Response envelopes report `num_found` as the total match count.
        request:
          queryParameters:
            start:
              role: page
            rows:
              role: pageSize
        response:
          bodyFields:
            num_found:
              role: totalCount
      pageOnly:
        type: pageNumber
        description: >-
          Used by the recall/history lookups, which only expose a 1-based
          `page` parameter with no client-controlled page size.
        request:
          queryParameters:
            page:
              role: page
- target: "$.paths['/car/recall/{vin}'].get"
  update:
    x-pagination:
    - scheme: pageOnly
- target: "$.paths['/history/car/uk/{vrm}'].get"
  update:
    x-pagination:
    - scheme: pageOnly
