overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/bdea260b91b4c49605ff3aa287e916031b80ca29/APIs/agco-ats.com/v1/openapi.yaml
info:
  title: AGCO ATS API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      offset:
        type: pageNumber
        description: >-
          Offset/limit pagination. The response wraps results as
          {Entities, Metadata}, where Metadata.TotalCount/Limit/Offset
          echo the effective paging window.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
        response:
          bodyFields:
            Metadata.TotalCount:
              role: totalCount
            Metadata.Limit:
              role: pageSize
      limitOnly:
        type: pageNumber
        description: >-
          Same response envelope as offset, but these two endpoints
          only expose a limit parameter, with no way for the client to
          set the offset directly.
        request:
          queryParameters:
            limit:
              role: pageSize
        response:
          bodyFields:
            Metadata.TotalCount:
              role: totalCount
            Metadata.Limit:
              role: pageSize
