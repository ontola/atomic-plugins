overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/4d66b23dc5948016b50e79b944a0b084c7000da7/APIs/bufferapp.com/1/swagger.yaml
info:
  title: Buffer API Pagination Schemes
  version: 2.0.0
actions:
- target: "$"
  update:
    x-paginationSchemes:
      pageNumber:
        type: pageNumber
        description: >-
          Buffer paginates status-update listings with a 1-based `page`
          number and a `count` page size (1-100). Responses are a bare
          array with no total-count envelope in this spec.
        request:
          queryParameters:
            page:
              role: page
            count:
              role: pageSize
- target: "$.paths['/profiles/{id}/updates/pending{mediaTypeExtension}'].get"
  update:
    x-pagination:
    - scheme: pageNumber
- target: "$.paths['/profiles/{id}/updates/sent{mediaTypeExtension}'].get"
  update:
    x-pagination:
    - scheme: pageNumber
- target: "$.paths['/updates/{id}/interactions{mediaTypeExtension}'].get"
  update:
    x-pagination:
    - scheme: pageNumber
