overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/4d66b23dc5948016b50e79b944a0b084c7000da7/APIs/blazemeter.com/4/swagger.yaml
info:
  title: BlazeMeter API Pagination Schemes
  version: 2.0.0
actions:
  - target: "$"
    update:
      x-paginationSchemes:
        offset:
          type: pageNumber
          description: >-
            BlazeMeter uses skip/limit pagination on list endpoints such as
            collections, tests, and masters. `skip` sets the starting offset
            and `limit` controls the maximum number of results (default 1000).
          request:
            queryParameters:
              skip:
                role: offset
              limit:
                role: pageSize
