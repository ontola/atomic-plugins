# Swagger 2.0 revision of pagination-dec74da7a6785d5d5b83bc6a4cebc07336d67ec9-overlay.yaml.
# The pinned OAD has no `components`, so the paginationSchemes map is the root
# `x-paginationSchemes` vendor extension (overlays/README.md, "Swagger 2.0 documents");
# operation targets are unchanged. Composition is checked against the pinned
# OAD; live-provider behavior is not certified.
overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/avaza.com/v1/swagger.yaml
info:
  title: Avaza API Pagination Schemes
  version: 2.0.0
actions:
  - target: "$"
    update:
      x-paginationSchemes:
        pageNumber:
          type: pageNumber
          description: >-
            Avaza uses 1-based page-number pagination across all list endpoints.
            `pageNumber` selects the page (starting from 1) and `pageSize`
            controls items per page (max 1000). Responses include PageNumber,
            PageSize, and TotalCount.
          request:
            queryParameters:
              pageNumber:
                role: page
              pageSize:
                role: pageSize
          response:
            bodyFields:
              PageNumber:
                role: currentPage
              PageSize:
                role: pageSize
              TotalCount:
                role: totalCount
