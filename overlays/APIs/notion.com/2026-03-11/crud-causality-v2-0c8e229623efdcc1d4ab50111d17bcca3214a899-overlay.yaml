# v2 of crud-causality-0c8e2296...: v1's schemas and resources unchanged, plus the page create
# (POST /pages) with CRUD Causality 0.8.0 committedErrors. Source:
# https://developers.notion.com/reference/request-limits ("Retry a write that returns 503"):
# "A write can save its change and still return 503 when Notion runs out of time building the
# response. Repeating that write applies the change twice"; "When the request created a page
# or a database, additional_data.committed_resource_id holds the ID of the new object."
# The create's own response is the page object, whose id fills the identity template.
# Only the page create is declared: for an append of block children, committed_resource_id
# holds the parent block's id, which CRUD Causality 0.8.0 §4.3.3 says does not qualify.
# This is the first write v1 does not declare: v1 is read-only. Unpublished; no dated catalog
# selects it. Needs CRUD Causality 0.8.0 (openapi-extensions/spec/crud-causality, §4.3.3).
overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/0c8e229623efdcc1d4ab50111d17bcca3214a899/APIs/notion.com/2026-03-11/openapi.yaml
info:
  title: Notion API CRUD Causality (data sources and pages, with the page create)
  version: '2026-03-11-v2'
# v1 was read-only, like Clockify's; v2 adds the page create (no update or delete). The two
# resources a read-only import walks are every data source shared with the
# connection (listed through POST /search, filtered to data sources) and each
# data source's pages (POST /data_sources/{data_source_id}/query). Pages get
# their data_source_id from the data source identity binding, the way Google
# Calendar events get their calendarId.
#
# Both lists are POST operations. The CRUD Causality extension has no field
# for a collection's list method or fixed request body, so each collection
# declares two extension keys that syncables/browser reads:
#   x-list-method: POST  -> list with paths[urlTemplate].post, not .get
#   x-list-body          -> fixed JSON body fields; the pagination scheme's
#                           body fields (bodyCursor, pagination-0c8e229623efdcc1d4ab50111d17bcca3214a899-overlay.yaml)
#                           are merged over them per page.
# The typed schemas below cover only the top-level page and data source
# fields. `properties` stays opaque JSON; the Notion lens in
# atomic-plugins integrations/notion/ projects it by stable property id.
actions:
  - target: $.components.schemas
    update:
      NotionDataSource:
        type: object
        required: [object, id]
        properties:
          object: {type: string}
          id: {type: string, format: uuid}
          created_time: {type: string, format: date-time}
          last_edited_time: {type: string, format: date-time}
          title:
            type: array
            description: Rich text title of the data source.
            items: {$ref: '#/components/schemas/JsonObject'}
          properties:
            type: object
            description: The data source's property schema, keyed by property name.
            additionalProperties: true
          parent: {type: object, additionalProperties: true}
          url: {type: string}
          archived: {type: boolean}
          in_trash: {type: boolean}
      NotionPage:
        type: object
        required: [object, id]
        properties:
          object: {type: string}
          id: {type: string, format: uuid}
          created_time: {type: string, format: date-time}
          last_edited_time: {type: string, format: date-time}
          properties:
            type: object
            description: Property values keyed by property name; each value carries its stable property id.
            additionalProperties: true
          parent: {type: object, additionalProperties: true}
          url: {type: string}
          archived: {type: boolean}
          in_trash: {type: boolean}
  - target: $.components
    update:
      crudResources:
        data_source:
          description: A Notion data source (the table behind a database) shared with the connection.
          schema: {$ref: '#/components/schemas/NotionDataSource'}
          identity:
            urlTemplate: /data_sources/{data_source_id}
            bindings:
              data_source_id: {field: id}
          collections:
            data_sources:
              urlTemplate: /search
              x-list-method: POST
              x-list-body:
                filter: {property: object, value: data_source}
                page_size: 100
        page:
          description: A row of a Notion data source.
          schema: {$ref: '#/components/schemas/NotionPage'}
          identity:
            urlTemplate: /pages/{page_id}
            bindings:
              page_id: {field: id}
          collections:
            pages:
              urlTemplate: /data_sources/{data_source_id}/query
              x-list-method: POST
              x-list-body:
                page_size: 100
  - target: $.paths['/pages'].post
    update:
      x-crud:
        action: create
        resource: page
        url: {source: template}
        description: >-
          Creates a page; the response is the page object, whose id is the
          page_id of the identity template.
        committedErrors:
          - status: [503]
            identity:
              page_id: additional_data.committed_resource_id
            description: >-
              Notion documents that a create can be saved and still answer
              503, and that additional_data.committed_resource_id then holds
              the new page's id. A 503 without it stays unknown.
