overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/0c8e229623efdcc1d4ab50111d17bcca3214a899/APIs/notion.com/2026-03-11/openapi.yaml
info:
  title: Notion OAuth authentication profile
  version: 1.0.0
actions:
  - target: $.security
    update:
      - notionOAuth: []
  - target: $.components.securitySchemes
    update:
      notionOAuth:
        type: oauth2
        flows:
          authorizationCode:
            authorizationUrl: https://api.notion.com/v1/oauth/authorize
            tokenUrl: https://api.notion.com/v1/oauth/token
            scopes: {}
        x-oauth-authentication-details:
          authorizationServerMetadata:
            token_endpoint_auth_methods_supported: [client_secret_basic]
          authorizationCode:
            pkce:
              requirement: unsupported
            profile:
              parameters:
                - parameter:
                    name: owner
                    in: query
                    schema: { type: string, enum: [user] }
                  value: user
          tokenEndpointOperation: '#/paths/~1oauth~1token/post'
          refreshEndpointOperation: '#/paths/~1oauth~1token/post'
  - target: $.paths['/oauth/token'].post.security
    update:
      - notionOAuthClient: []
