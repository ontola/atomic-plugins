# Reviewed 2026-10-14 against the pinned OAD and official provider documentation; no live calls.
# Source: https://docs.stripe.com/api/pagination: "All top-level API resources have support
#   for bulk fetches through “list” API methods. ... These list API methods share a common
#   structure and accept, at a minimum, the following three parameters: `limit`,
#   `starting_after`, and `ending_before`."; starting_after "is an object ID that defines
#   your place in the list. For example, if you make a list request and receive 100 objects,
#   ending with `obj_foo`, your subsequent call can include `starting_after=obj_foo` to fetch
#   the next page of the list."; has_more: "If `false`, this set comprises the end of the
#   list."; objects come "in reverse chronological order".
# Source: the pinned OAD: 99 GET operations take starting_after and answer
#   {"data": [...], "has_more": ...}; 97 describe starting_after in the words above, exchange
#   rates as "the currency that defines your place in the list" (an exchange rate's id is its
#   currency code), and treasury financial accounts as "An object ID cursor for use in
#   pagination."
# Needs Pagination Schemes 0.9.0 (openapi-extensions/spec/pagination-schemes, fromLastItem
# and hasMore, §4.3.3). A 0.8.0 consumer reads the scheme as a pageToken scheme without a
# next token and stops after one page, so do not use this revision with one.
#
# Revision 2 of pagination-dec74da7...: v1 declared the `cursor` scheme but applied it to no
# operation and gave no way to find the next cursor. This revision redefines `cursor` as
# §4.3.3 rule (a) describes it, Stripe's own example: starting_after takes the id of the last
# object of the previous page, a position in Stripe's list order (newest first; rule (a)
# needs no ascending order), and has_more false ends the list. It applies the scheme to
# every list operation of the pinned document that takes starting_after.
# Not declared: ending_before (it pages backwards); Stripe's /v2 APIs (another pagination
# interface). Invoices: an invoice's id "is always present unless the invoice is an upcoming
# invoice", which the list does not return. External accounts and customer sources list
# several object types, each with an id. An item without an id ends the read with an error
# (§4.3.3 step 4).
overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/stripe.com/2022-11-15/openapi.yaml
info:
  title: Stripe API Pagination Schemes (revision 2)
  version: 2.0.0
actions:
- target: $.components
  update:
    paginationSchemes:
      cursor:
        type: pageToken
        autoDetect: false
        description: Send no starting_after first, then the id of the previous page's last object; has_more
          false ends the list. Objects come newest first.
        request:
          queryParameters:
            starting_after:
              role: cursor
              fromLastItem: id
            limit:
              role: pageSize
        response:
          envelope:
            itemsField: data
          bodyFields:
            has_more:
              role: hasMore
