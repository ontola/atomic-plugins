overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/dec74da7a6785d5d5b83bc6a4cebc07336d67ec9/APIs/stripe.com/2022-11-15/openapi.yaml
info:
  title: Stripe API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        cursor:
          type: pageToken
          description: >
            Stripe uses cursor-based pagination with object IDs as cursors.
            Pass the ID of the last object returned as `starting_after` to
            fetch the next page. The response `has_more` field indicates
            whether additional pages exist.
          request:
            queryParameters:
              starting_after:
                role: cursor
                description: >
                  A cursor for use in pagination. `starting_after` is an
                  object ID that defines your place in the list. For instance,
                  if you make a list request and receive 100 objects, ending
                  with `obj_foo`, your subsequent call can include
                  `starting_after=obj_foo` to fetch the next page of the list.
              limit:
                role: pageSize
                description: >
                  A limit on the number of objects to be returned. Limit can
                  range between 1 and 100, and the default is 10.
