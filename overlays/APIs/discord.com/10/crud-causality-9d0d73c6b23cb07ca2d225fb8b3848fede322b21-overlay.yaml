overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/9d0d73c6b23cb07ca2d225fb8b3848fede322b21/APIs/discord.com/10/openapi.yaml
info:
  title: Discord API CRUD Causality
  version: 1.0.0
# CRUD metadata currently declares two OAuth reads on the full Discord OAD. OAuth user
# tokens can read the current user and the user's guild membership list, but
# cannot use the bot-only guild routes to read or mutate arbitrary guilds.
actions:
  - target: $.components
    update:
      crudResources:
        user:
          schema:
            $ref: '#/components/schemas/UserPIIResponse'
          description: The authenticated Discord user's basic profile.
          identity:
            urlTemplate: /users/@me
        guild:
          schema:
            $ref: '#/components/schemas/MyGuildResponse'
          description: A guild returned from the authenticated user's guild membership list.
          collections:
            myGuilds:
              urlTemplate: /users/@me/guilds
              x-list-query:
                limit: 200

  - target: $.paths['/users/@me'].get
    update:
      x-crud:
        action: read
        resource: user

  - target: $.paths['/users/@me/guilds'].get
    update:
      x-crud:
        action: list
        resource: guild
        collection: myGuilds
