overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/4d66b23dc5948016b50e79b944a0b084c7000da7/APIs/bbc.com/1.0.0/openapi.yaml
info:
  title: BBC Nitro API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      pageNumber:
        type: pageNumber
        description: >-
          The Nitro response envelope reports the current page, page size
          and total match count under `results`, and a next-page URL under
          `pagination.next.href`.
        request:
          queryParameters:
            page:
              role: page
            page_size:
              role: pageSize
        response:
          bodyFields:
            results.page:
              role: currentPage
            results.page_size:
              role: pageSize
            results.total:
              role: totalCount
            pagination.next.href:
              role: nextLink
- target: "$.paths['/availabilities'].get"
  update:
    x-pagination:
    - scheme: pageNumber
