# Reviewed 2026-10-09 against the pinned OAD and official provider documentation.
# Source: https://developer.todoist.com/api/v1/ (read from the page itself):
#   Errors, error_extra: "retry_after Integer: Seconds to wait before retrying. May be
#   returned on rate-limited requests and other API errors, not just 429 responses."
#   Status codes: "429 Too Many Requests: The user has sent too many requests in a given
#   amount of time."
#   Migrating from v9: the unified JSON error format (with error_extra) "is now the default
#   for the new Todoist API".
# Request limits gives numbers only for /sync (1000 partial and 100 full sync requests per
# user per 15 minutes), which the pinned OAD does not describe, so no limits are declared.
# Needs Throttling 0.3.0-draft (openapi-extensions/spec/throttling, bodyFields).
overlay: 1.0.0
info:
  title: Todoist API v1 throttling
  version: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/ac07532b0a0ac101cf8bae2a54177fb1d8ea3779/APIs/todoist.com/1/openapi.yaml
actions:
  - target: $
    update:
      x-throttling:
        bodyFields:
          error_extra.retry_after:
            role: retryAfter
            unit: deltaSeconds
            description: >-
              Seconds to wait before retrying, in the JSON error body. Todoist
              may send it on other errors too; it is read only from a
              throttled response.
        signals:
          - status: [429]
            meaning: throttled
            description: >-
              The user has sent too many requests in a given amount of time.
              Todoist documents no other status for rate limiting, so no other
              response is throttling.
