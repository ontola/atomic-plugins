overlay: 1.0.0
extends: https://raw.githubusercontent.com/ontola/openapi-directory/ac07532b0a0ac101cf8bae2a54177fb1d8ea3779/APIs/todoist.com/1/openapi.yaml
info:
  title: Todoist API v1 Pagination Schemes
  version: 1.0.0
# Todoist API v1 uses opaque cursor pagination. List responses contain a
# `results` array and `next_cursor`; the cursor is omitted (or null) on the
# final page. `limit` is the page-size control on both collections.
actions:
  - target: $.components
    update:
      paginationSchemes:
        cursor:
          type: pageToken
          request:
            queryParameters:
              cursor:
                role: cursor
                description: Opaque cursor returned by the preceding page.
              limit:
                role: pageSize
                description: Maximum number of results per page.
          response:
            bodyFields:
              next_cursor:
                role: nextCursor
                description: Opaque cursor for the next page, when present.

  - target: $.paths['/projects'].get
    update:
      x-pagination:
        - scheme: cursor
  - target: $.paths['/tasks'].get
    update:
      x-pagination:
        - scheme: cursor
